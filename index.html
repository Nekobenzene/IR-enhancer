/**
 * 「输入色标」多行文本框：粘贴一份色标 JSON，就地校验。
 * 校验不通过时把原因显示在框下方并**保持弹窗打开**（文本不丢），
 * 通过则 resolve 成解析好的色标对象；取消 / Esc 返回 null。
 */
function openTextScaleDialog(title, hint, initial) {
  return new Promise(resolve => {
    const dlg = $('textScaleDialog');
    const area = $('textScaleArea');
    const okBtn = $('textScaleOk');
    const cancelBtn = $('textScaleCancel');
    const errBox = $('textScaleErr');

    $('textScaleTitle').textContent = title || '输入色标';
    $('textScaleHint').textContent = hint || '把色标 JSON 粘贴到这里';
    area.value = initial || '';
    errBox.textContent = '';
    errBox.classList.add('hidden');

    const showErr = msg => {
      errBox.textContent = msg;
      errBox.classList.remove('hidden');
      area.focus();
    };
    const cleanup = () => {
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      dlg.removeEventListener('close', onEsc);
    };
    const finish = value => { cleanup(); dlg.close(); resolve(value); };

    function onOk() {
      const text = area.value.trim();
      if (!text) { showErr('请先粘贴或输入色标 JSON 文本。'); return; }
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        showErr('JSON 解析失败：' + e.message);
        return;
      }
      let scale;
      try {
        scale = scaleFromObject(data);
      } catch (e) {
        showErr('配置内容非法：' + e.message);
        return;
      }
      finish(scale);
    }
    function onCancel() { finish(null); }
    function onEsc() { cleanup(); resolve(null); }

    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    dlg.addEventListener('close', onEsc);
    dlg.showModal();
    area.focus();
    area.setSelectionRange(area.value.length, area.value.length);
  });
}

/** 「打开色标 → 输入色标」：从文本载入一份色标（与「从设备中导入」等价，只是文本来源） */
async function actionInputScale() {
  if (state.busy) return false;
  if (!await confirmDiscardChanges('输入色标')) return false;
  const scale = await openTextScaleDialog('输入色标',
    '把色标 JSON 粘贴到这里（「导出到剪贴板」复制出来的内容可以直接用）', '');
  if (!scale) return false;
  state.scale = scale;
  state.scaleHandle = null;
  state.scaleName = null;               // 文本来源，没有对应文件
  state.baseline = scaleToText(scale);
  state.nodeChecked.clear();
  refreshAll();
  updateActionStates();
  log('已从「输入色标」载入：' + scale.name + '（' + scale.nodes.length + ' 个节点）');
  return true;
}

/**
 * 写剪贴板：优先用异步剪贴板 API（需要安全上下文 + 用户手势），
 * 不可用时退回隐藏 textarea + execCommand('copy')，两条路都失败才返回 false。
 */
async function copyTextToClipboard(text) {
  try {
    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* 继续走兜底 */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', 'readonly');
    ta.style.cssText = 'position:fixed;left:-10000px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    ta.remove();
    return !!ok;
  } catch (e) {
    return false;
  }
}

function makeCanvas(w, h) {
  if (typeof OffscreenCanvas === 'function') return new OffscreenCanvas(w, h);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/** 读取设计令牌，避免在 canvas 里硬编码颜色 */
function cssVar(name, fallback) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
}

/* =========================================================================
 * 第 9 部分：颜色编辑器（原生取色器 + HEX + RGB 三种表示同步）
 * ========================================================================= */

class ColorEditor {
  /** swatchId 是一个可见的 <input type="color">，即原生取色器本身（同时充当色块预览）。 */
  constructor(swatchId, hexId, rId, gId, bId, pickId) {
    this.swatch = $(swatchId);
    this.hex = $(hexId);
    this.rgb = [$(rId), $(gId), $(bId)];
    this.pickBtn = $(pickId);
    this.color = [0, 0, 0];

    this.hex.addEventListener('input', () => {
      const parsed = this._tryParse(this.hex.value);
      if (parsed) this.setColor(parsed);
    });
    this.hex.addEventListener('blur', () => {
      const parsed = this._tryParse(this.hex.value);
      if (!parsed) this._sync();            // 非法输入：恢复该字段之前的合法值
      else this.setColor(parsed);
      this._sync();
    });
    this.hex.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); this.hex.blur(); } });
    this.rgb.forEach(inp => {
      inp.addEventListener('input', () => {
        this.setColor(this.rgb.map(x => Math.max(0, Math.min(255, Math.round(Number(x.value) || 0)))));
      });
      inp.addEventListener('blur', () => {
        this.setColor(this.rgb.map(x => Math.max(0, Math.min(255, Math.round(Number(x.value) || 0)))));
        this._sync();
      });
    });

    // 「选择颜色…」按钮同样打开原生取色器，弹窗锚定在可见的色块上
    this.pickBtn.addEventListener('click', () => this.openNativePicker());
    this.swatch.addEventListener('input', () => {
      const parsed = this._tryParse(this.swatch.value);
      if (parsed) this.setColor(parsed);
    });
    this.swatch.addEventListener('change', () => {
      const parsed = this._tryParse(this.swatch.value);
      if (parsed) this.setColor(parsed);
    });
  }

  openNativePicker() {
    this.swatch.value = rgbToHex(this.color).toLowerCase();
    try {
      if (typeof this.swatch.showPicker === 'function') {
        this.swatch.showPicker();           // 显式弹出原生取色器
        return;
      }
    } catch (e) { /* 不支持或缺少用户手势时退回 click() */ }
    this.swatch.click();
  }

  _tryParse(text) {
    let s = String(text || '').trim();
    if (!s) return null;
    if (!s.startsWith('#')) s = '#' + s;
    try { return parseColor(s); } catch (e) { return null; }
  }
  setColor(rgb, sync = true) {
    this.color = [rgb[0], rgb[1], rgb[2]];
    if (sync) this._sync();
  }
  _sync() {
    const hex = rgbToHex(this.color);
    this.swatch.value = hex.toLowerCase();   // input[type=color] 只接受 #rrggbb
    this.hex.value = hex;
    this.rgb.forEach((inp, i) => { inp.value = String(this.color[i]); });
  }
}

/* =========================================================================
 * 第 10 部分：预览画布（Fit / 滚轮缩放 / 拖动平移 / 重置视图）
 * ========================================================================= */

function fitCanvas(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, canvas.clientWidth), h = Math.max(1, canvas.clientHeight);
  const pw = Math.round(w * dpr), ph = Math.round(h * dpr);
  if (canvas.width !== pw || canvas.height !== ph) { canvas.width = pw; canvas.height = ph; }
  return dpr;
}

function applyFit() {
  const cv = $('previewCanvas');
  const img = state.offscreen;
  if (!img) return;
  const w = cv.clientWidth, h = cv.clientHeight;
  const s = Math.min(w / img.width, h / img.height);
  state.preview.scale = s;
  state.preview.ox = (w - img.width * s) / 2;
  state.preview.oy = (h - img.height * s) / 2;
}

function drawPreview() {
  const cv = $('previewCanvas');
  const dpr = fitCanvas(cv);
  const ctx = cv.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  // 有图时让 #previewWrap 显示棋盘格，透明区域一眼可见
  $('previewWrap').classList.toggle('checker', !!state.offscreen);
  // Fit 时把纵向滑动留给页面（手机上还能上下滚），放大后拖动才是平移
  cv.classList.toggle('preview-scrollable', state.preview.fit);
  if (!state.offscreen) {
    ctx.fillStyle = cssVar('--text-3', '#7b838c');
    ctx.font = (13 * dpr) + 'px "Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('请添加 PNG / JPG 图片', cv.width / 2, cv.height / 2);
    return;
  }
  const img = state.offscreen;
  const p = state.preview;
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, p.ox * dpr, p.oy * dpr, img.width * p.scale * dpr, img.height * p.scale * dpr);
}

function resetPreviewView() {
  state.preview.fit = true;
  applyFit();
  drawPreview();
}

/** 生成预览用小图（灰度和 Alpha 都是盒式平均，避免细线丢失）。 */
function downscaleGrayAlpha(gray, alpha, w, h, maxDim) {
  const longest = Math.max(w, h);
  if (longest <= maxDim) return { gray: gray, alpha: alpha, width: w, height: h };
  const s = maxDim / longest;
  const nw = Math.max(1, Math.round(w * s)), nh = Math.max(1, Math.round(h * s));
  const g = new Uint8Array(nw * nh), a = new Uint8Array(nw * nh);
  for (let y = 0; y < nh; y++) {
    const y0 = Math.floor(y * h / nh), y1 = Math.max(y0 + 1, Math.floor((y + 1) * h / nh));
    for (let x = 0; x < nw; x++) {
      const x0 = Math.floor(x * w / nw), x1 = Math.max(x0 + 1, Math.floor((x + 1) * w / nw));
      let sg = 0, sa = 0, n = 0;
      for (let yy = y0; yy < y1; yy++) {
        const base = yy * w;
        for (let xx = x0; xx < x1; xx++) { sg += gray[base + xx]; sa += alpha[base + xx]; n++; }
      }
      g[y * nw + x] = Math.round(sg / n);
      a[y * nw + x] = Math.round(sa / n);
    }
  }
  return { gray: g, alpha: a, width: nw, height: nh };
}

function rebuildOffscreen() {
  if (!state.grayPrev || !state.mapper) { state.offscreen = null; drawPreview(); return; }
  const w = state.prevSize.width, h = state.prevSize.height;
  const rgba = colorize(state.grayPrev, state.alphaPrev, state.mapper, w, h);
  const cv = makeCanvas(w, h);
  cv.getContext('2d').putImageData(new ImageData(rgba, w, h), 0, 0);
  state.offscreen = cv;
  if (state.preview.fit) applyFit();
  drawPreview();
}

/* =========================================================================
 * 第 11 部分：Legend（垂直色标条，宽度固定 40 px）
 * ========================================================================= */

const LEGEND_BAR_CSS = 16;      // 色标柱宽度（原 40px 的 2/5）

function drawLegend() {
  const cv = $('legendCanvas');
  const dpr = fitCanvas(cv);
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);          // 透明画布：色标柱直接落在灰色背景上

  const barW = Math.round(LEGEND_BAR_CSS * dpr);
  const mapper = state.mapper;
  // 温度轴 = 图片两端的温度：柱子自上而下就是灰度 0 → 255（黑色端 → 白色端），
  // 色标不足的部分把两端节点色拉伸补齐，超出图片温度的部分直接截断（不显示）。
  if (mapper && H > 0) {
    const tmp = makeCanvas(1, H);
    const tctx = tmp.getContext('2d');
    const img = tctx.createImageData(1, H);
    for (let y = 0; y < H; y++) {
      const p = ((y + 0.5) / H) * P_MAX;
      const c = mapper.colorAtKelvin(pToKelvin(p));   // 与图片着色完全相同的算法
      const o = y * 4;
      img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
    }
    tctx.putImageData(img, 0, 0);
    // 1 像素宽的色带拉伸绘制：必须关掉插值，否则边缘会采样到透明而发白
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(tmp, 0, 0, 1, H, 0, 0, barW, H);
    ctx.imageSmoothingEnabled = true;
  } else {
    ctx.fillStyle = cssVar('--n-4', '#e3e7eb');
    ctx.fillRect(0, 0, barW, H);
  }
  ctx.strokeStyle = cssVar('--stroke-2', '#d5dae0');
  ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, barW - 1, H - 1);
  if (!mapper) return;

  const tickFont = Math.max(9, Math.round(10 * dpr));
  const numFont = cssVar('--font-num', 'Consolas, monospace');
  const labelColor = cssVar('--text-2', '#5a626b');
  const limitColor = cssVar('--text-1', '#24292e');
  const tickW = Math.round(6 * dpr);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  const drawLabel = (y, text) => {
    const ty = Math.max(tickFont / 2, Math.min(H - tickFont / 2, y));
    ctx.fillText(text, barW + 6 * dpr, ty);
  };

  const entries = legendEntries();
  // 标签间距不足时按整数倍抽稀，只画刻度线不画文字；黑色端 / 白色端的温度永远标注
  const spacing = H / Math.max(1, entries.length);
  const stride = Math.max(1, Math.ceil((15 * dpr) / spacing));

  entries.forEach((e, i) => {
    const kelvin = e.c + KELVIN_OFFSET;
    let y = Math.round(kelvinToP(kelvin) / P_MAX * (H - 1));
    y = Math.max(0, Math.min(H - 1, y));
    ctx.fillStyle = 'rgba(255, 255, 255, .92)';
    ctx.fillRect(0, y, tickW, 1);
    ctx.fillStyle = cssVar('--text-1', '#24292e');
    ctx.fillRect(0, y + 1, tickW, 1);
    if (!e.isLimit && i % stride !== 0) return;
    ctx.font = (e.isLimit ? '600 ' : '') + tickFont + 'px ' + numFont;
    ctx.fillStyle = e.isLimit ? limitColor : labelColor;
    drawLabel(y, String(Math.round(toDisplay(kelvin, state.unit))));
  });
}

/* =========================================================================
 * 第 12 部分：节点卡片面板
 * ========================================================================= */

/** 双箭头图标（上箭头 + 下箭头）：表示「同一位置的两个节点可交换顺序」 */
const SWAP_ARROW_SVG =
  '<svg width="14" height="12" viewBox="0 0 14 12" aria-hidden="true">' +
  '<g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M4 10.5 V1.9 M4 1.9 L1.7 4.2 M4 1.9 L6.3 4.2"/>' +
  '<path d="M10 1.5 V10.1 M10 10.1 L7.7 7.8 M10 10.1 L12.3 7.8"/>' +
  '</g></svg>';

function makeNodeCard(node) {
  const pinned = isPinned(node);
  const card = document.createElement('div');
  card.className = 'node-card';

  // 保留节点不参与批量选择（它本来就不允许删除）
  if (state.nodeSelMode && !pinned) {
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = state.nodeChecked.has(node.uid);
    cb.addEventListener('click', e => {
      e.stopPropagation();
      if (cb.checked) state.nodeChecked.add(node.uid); else state.nodeChecked.delete(node.uid);
    });
    card.appendChild(cb);
  }

  const sw = document.createElement('div');
  sw.className = 'swatch';
  sw.style.background = rgbToHex(node.rgb);
  card.appendChild(sw);

  const pos = document.createElement('div');
  pos.className = 'pos';
  const suffix = unitSuffix(state.unit);
  pos.textContent = formatDisplay(node.kelvin, state.unit) + (suffix ? ' ' + suffix : '');
  card.appendChild(pos);

  if (pinned) {
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = '保留';
    tag.title = '保留节点：位置与颜色都能改，但不会被删除';
    card.appendChild(tag);
  }

  card.title = pinned
    ? '保留节点：位置与颜色都能改，但不会被删除'
    : '单击编辑该节点（位置 / 颜色）';
  card.addEventListener('click', () => {
    if (state.nodeSelMode) {
      if (pinned) return;
      if (state.nodeChecked.has(node.uid)) state.nodeChecked.delete(node.uid);
      else state.nodeChecked.add(node.uid);
      renderNodeCards();
      return;
    }
    editNode(node.uid);
  });
  return card;
}

function makeSwapButton(uid) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'node-swap';
  const tip = '这两个节点温度相同：交换顺序即可改变硬跳变方向';
  btn.title = tip;
  btn.setAttribute('aria-label', tip);
  btn.innerHTML = SWAP_ARROW_SVG;
  btn.addEventListener('click', e => { e.stopPropagation(); swapNode(uid); });
  return btn;
}

function renderNodeCards() {
  const list = $('nodeList');
  const scrollTop = list.scrollTop;
  list.innerHTML = '';
  const nodes = state.scale.nodes;
  let i = 0;
  while (i < nodes.length) {
    const node = nodes[i];
    const next = nodes[i + 1];
    // 温度相同的两个节点：两张卡片无隙并置，双箭头按钮嵌在中间
    const paired = !!next && positionKey(node.kelvin) === positionKey(next.kelvin);
    if (paired) {
      const group = document.createElement('div');
      group.className = 'node-group';
      group.appendChild(makeNodeCard(node));
      group.appendChild(makeNodeCard(next));
      group.appendChild(makeSwapButton(node.uid));   // 骑在两张卡片的分界线上
      list.appendChild(group);
      i += 2;
    } else {
      list.appendChild(makeNodeCard(node));
      i += 1;
    }
  }
  list.scrollTop = scrollTop;
}

/* =========================================================================
 * 第 13 部分：图片列表
 * ========================================================================= */

function renderImageList() {
  const list = $('imageList');
  const scrollTop = list.scrollTop;
  list.innerHTML = '';
  if (!state.entries.length) {
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.innerHTML =
      '<div class="eh-art"></div>' +
      '<div class="eh-title">还没有图片</div>' +
      '<div class="eh-sub">点击下方「添加图片」导入 PNG 或 JPG</div>';
    list.appendChild(hint);
  }
  state.entries.forEach((entry, i) => {
    const row = document.createElement('div');
    row.className = 'img-row' + (i === state.currentIndex ? ' current' : '');
    row.title = entry.displayName;

    if (state.imgSelMode) {
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!entry.checked;
      cb.addEventListener('click', e => {
        e.stopPropagation();
        toggleEntryChecked(i, cb.checked);
      });
      row.appendChild(cb);
    }

    const box = document.createElement('div');
    box.className = 'thumbBox';
    if (entry.thumb) {
      const c = document.createElement('canvas');
      c.width = entry.thumb.width;
      c.height = entry.thumb.height;
      c.getContext('2d').drawImage(entry.thumb, 0, 0);
      box.appendChild(c);
    }
    row.appendChild(box);

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = entry.displayName;
    row.appendChild(name);

    // 选择模式：点击整行 / 缩略图 / 名称 / 其他区域都只切换勾选，不切换预览
    row.addEventListener('click', () => {
      if (state.imgSelMode) toggleEntryChecked(i, !state.entries[i].checked);
      else setCurrentImage(i);
    });

    list.appendChild(row);
  });
  list.scrollTop = scrollTop;
  updateSelectionButtons();
}

function toggleEntryChecked(index, value) {
  const entry = state.entries[index];
  if (!entry) return;
  entry.checked = value;
  renderImageList();
}

function updateSelectionButtons() {
  $('nodeSelBtns').classList.toggle('show', state.nodeSelMode);
  $('imgSelBtns').classList.toggle('show', state.imgSelMode);
}

/* =========================================================================
 * 第 14 部分：刷新总入口
 * ========================================================================= */

function refreshAll() {
  sortNodes(state.scale.nodes);
  state.mapper = new ColorMapper(state.scale.nodes);
  const nameInput = $('scaleName');
  if (document.activeElement !== nameInput) nameInput.value = state.scale.name;
  updateRangeInputs();
  updateScaleRangeInfo();
  drawLegend();
  renderNodeCards();
  updateTitle();
  rebuildOffscreen();
}

/** 第二列只显示色标当前的温度范围（由两端节点决定，不可直接编辑） */
function updateScaleRangeInfo() {
  const r = scaleTempRange(state.scale.nodes);
  const suffix = unitSuffix(state.unit);
  const hi = Math.round(toDisplay(r.highK, state.unit));
  const lo = Math.round(toDisplay(r.lowK, state.unit));
  $('rangeLabel').textContent = '色标范围（' + state.unit + '）';
  $('scaleRangeInfo').textContent = hi + suffix + ' ~ ' + lo + suffix + '（由最高温 / 最低温节点决定）';
}

function updateTitle() {
  const mark = isDirty() ? '*' : '';
  document.title = state.scale.name + mark + ' - 红外灰度色标增强工具';
  $('scaleName').title = state.scale.name + mark;
}

function isDirty() { return scaleToText(state.scale) !== state.baseline; }

function markClean() {
  state.baseline = scaleToText(state.scale);
  updateTitle();
}

function updateActionStates() {
  const hasImage = state.currentIndex >= 0 && state.currentIndex < state.entries.length;
  const hasAny = state.entries.length > 0;
  const busy = state.busy;
  setMenuEnabled('presets', !busy);
  setMenuEnabled('open', !busy);
  setMenuEnabled('myScales', !busy);
  setMenuEnabled('manageScales', !busy);
  setMenuEnabled('importToStore', !busy);
  setMenuEnabled('inputScale', !busy);
  setMenuEnabled('save', !busy);
  setMenuEnabled('saveas', !busy);
  setMenuEnabled('copyScale', !busy);
  setMenuEnabled('exportOne', hasImage && !busy);
  // 「批量导出」始终可点：没有勾选时点了会提示「请选择图片」，而不是静默无反应
  setMenuEnabled('exportBatch', !busy);
  setMenuEnabled('quit', !busy);
  setTriggerEnabled('btnExportMenu', !busy);
  setTriggerEnabled('btnOpenScale', !busy);
  setTriggerEnabled('btnManageScales', !busy);
  setTriggerEnabled('btnSaveScale', !busy);

function setMenuEnabled(act, enabled) {
  document.querySelectorAll('[data-act="' + act + '"]').forEach(el => {
    el.classList.toggle('disabled', !enabled);
    if (el.tagName === 'BUTTON') el.disabled = !enabled;

}

function setTriggerEnabled(id, enabled) {
  const el = $(id);
  if (el) el.disabled = !enabled;
}

function setBusy(busy) {
  state.busy = busy;
  ['scaleName', 'unitSelect', 'imageRangeBlack', 'imageRangeWhite', 'nodeSelectMode', 'btnAddNode', 'btnNodeAll', 'btnNodeNone',
   'btnNodeDelete', 'imgSelectMode', 'btnImgAll', 'btnImgNone', 'btnImgDelete',
   'btnAddImages', 'btnResetView', 'btnExportMenu', 'btnOpenScale', 'btnSaveScale',
   'btnManageScales'].forEach(
    id => { $(id).disabled = busy; });
  $('nodeList').style.pointerEvents = busy ? 'none' : '';
  $('imageList').style.pointerEvents = busy ? 'none' : '';
  $('previewCanvas').style.pointerEvents = busy ? 'none' : '';
  $('app').classList.toggle('busy', busy);
  $('app').setAttribute('aria-busy', busy ? 'true' : 'false');
  updateActionStates();
}

/* =========================================================================
 * 第 15 部分：图片导入 / 切换 / 删除
 * ========================================================================= */

let entryUidSeq = 0;

function makeDisplayName(filename, used) {
  const dot = filename.lastIndexOf('.');
  const stem = dot > 0 ? filename.slice(0, dot) : filename;
  const ext = dot > 0 ? filename.slice(dot) : '';
  let candidate = filename, i = 1;
  while (used.has(candidate.toLowerCase())) { candidate = stem + '(' + i + ')' + ext; i++; }
  used.add(candidate.toLowerCase());
  return candidate;
}

/** 支持的文件类型：PNG（灰度/灰度+Alpha/RGB/RGBA/调色板）与 JPG / JPEG。 */
function isSupportedImageName(name) {
  return /\.(png|jpe?g)$/i.test(name);
}
function isJpegName(name) {
  return /\.jpe?g$/i.test(name);
}
function isPngBytes(bytes) {
  const sig = [137, 80, 78, 71, 13, 10, 26, 10];
  if (!bytes || bytes.length < 8) return false;
  for (let i = 0; i < 8; i++) if (bytes[i] !== sig[i]) return false;
  return true;
}

/** 按文件真实内容选择解码方式：PNG 走内置精确解码，其它（JPG 等）走浏览器解码。 */
async function decodeImageFile(file) {
  let head = null;
  try {
    head = new Uint8Array(await file.slice(0, 8).arrayBuffer());
  } catch (e) { /* 读不到就交给浏览器解码 */ }
  if (isPngBytes(head)) {
    try {
      return await decodePNG(await file.arrayBuffer());
    } catch (e) {
      log('内置 PNG 解码不可用，改用浏览器解码：' + file.name + '（' + e.message + '）');
    }
  }
  return await decodePNGViaCanvas(file);
}

async function addImages(files) {
  const used = new Set(state.entries.map(e => e.displayName.toLowerCase()));
  const firstNew = state.entries.length;
  let added = 0;
  for (const file of files) {
    if (!isSupportedImageName(file.name)) { log('已忽略不支持的文件（仅支持 PNG / JPG）：' + file.name); continue; }
    const display = makeDisplayName(file.name, used);
    let thumb = null;
    try {
      const bmp = await createImageBitmap(file);
      const s = Math.min(THUMB_W / bmp.width, THUMB_H / bmp.height);
      const tw = Math.max(1, Math.round(bmp.width * s)), th = Math.max(1, Math.round(bmp.height * s));
      thumb = makeCanvas(tw, th);
      const tctx = thumb.getContext('2d');
      tctx.imageSmoothingEnabled = true;
      tctx.drawImage(bmp, 0, 0, tw, th);
      if (bmp.close) bmp.close();
    } catch (e) {
      log('缩略图生成失败：' + file.name + '（' + e.message + '）');
    }
    state.entries.push({
      id: ++entryUidSeq, file: file, displayName: display, thumb: thumb, checked: false,
    });
    added++;
    log('添加图片：' + display);
  }
  if (added) {
    renderImageList();
    updateActionStates();
    if (state.currentIndex < 0) setCurrentImage(firstNew, true);
  }
}

function setCurrentImage(index, force) {
  if (index < 0 || index >= state.entries.length) {
    state.currentIndex = -1;
    state.loadedEntryId = null;
    state.grayFull = state.alphaFull = state.grayPrev = state.alphaPrev = null;
    state.offscreen = null;
    $('previewInfo').textContent = '请添加 PNG / JPG 图片';
    $('previewInfo').title = '';
    renderImageList();
    drawPreview();
    updateActionStates();
    return;
  }
  state.currentIndex = index;
  const entry = state.entries[index];
  renderImageList();
  updateActionStates();
  if (entry.id === state.loadedEntryId && !force) return;
  state.loadedEntryId = entry.id;
  loadEntry(entry);
}

async function loadEntry(entry) {
  const token = ++state.loadToken;
  $('previewInfo').textContent = entry.displayName + '    正在加载…';
  $('previewWrap').classList.add('loading');
  try {
    const img = await decodeImageFile(entry.file);
    if (token !== state.loadToken) return;
    $('previewWrap').classList.remove('loading');
    state.grayFull = img.gray;
    state.alphaFull = img.alpha;
    state.fullSize = { width: img.width, height: img.height };
    const ds = downscaleGrayAlpha(img.gray, img.alpha, img.width, img.height, PREVIEW_MAX_DIM);
    state.grayPrev = ds.gray;
    state.alphaPrev = ds.alpha;
    state.prevSize = { width: ds.width, height: ds.height };
    const info = entry.displayName + '    ' + img.width + ' × ' + img.height;
    $('previewInfo').textContent = info;
    $('previewInfo').title = info;
    state.preview.fit = true;
    rebuildOffscreen();
  } catch (e) {
    if (token !== state.loadToken) return;
    log('加载失败：' + entry.displayName + '（' + e.message + '）');
    $('previewInfo').textContent = entry.displayName + '    加载失败';
    state.grayFull = state.alphaFull = state.grayPrev = state.alphaPrev = null;
    state.offscreen = null;
    drawPreview();
  }
}

/** 删除选中图片：按删除前的位置规则决定新的当前预览图。 */
async function deleteSelectedImages() {
  if (state.busy) return;
  const indexes = [];
  state.entries.forEach((e, i) => { if (e.checked) indexes.push(i); });
  if (!indexes.length) {
    await showMessage('删除图片', '请选择图片');   // 没勾选时给出明确提示
    return;
  }
  const checked = new Set(indexes);
  const n = state.entries.length;
  const oldCurrent = state.currentIndex;

  let newIndex = null;
  if (checked.has(oldCurrent)) {
    for (let j = oldCurrent + 1; j < n; j++) if (!checked.has(j)) { newIndex = j; break; }
    if (newIndex === null) for (let j = oldCurrent - 1; j >= 0; j--) if (!checked.has(j)) { newIndex = j; break; }
  } else if (oldCurrent >= 0) {
    newIndex = oldCurrent;                     // 当前预览未被删除：保持原预览图片
  }

  const removedNames = [...checked].sort((a, b) => a - b).map(i => state.entries[i].displayName);
  state.entries = state.entries.filter((e, i) => !checked.has(i));

  let target = -1;
  if (newIndex !== null) {
    target = 0;
    for (let i = 0; i < newIndex; i++) if (!checked.has(i)) target++;
  }

  log('删除图片 ' + removedNames.length + ' 张：' + removedNames.join('、'));
  state.entries.forEach(e => { e.checked = false; });
  state.currentIndex = -1;
  state.loadedEntryId = null;
  renderImageList();
  setCurrentImage(target, true);
  updateActionStates();
}

/* =========================================================================
 * 第 16 部分：图片温度（黑色端 / 白色端）与 色标节点增删改
 *
 * 黑色温度 = 灰度 0 的温度，白色温度 = 灰度 255 的温度；两者谁高都行
 * （浅色代表高温也支持）。上限 / 下限由程序比较大小后定出来，与色标无关，
 * 切换色标不会改变它。
 * ========================================================================= */

/** 刷新图片温度输入框（黑色端 / 白色端；只填数字，单位由标签给出） */
function updateRangeInputs() {
  $('imageRangeLabel').textContent = '温度（' + state.unit + '）';
  const bl = $('imageRangeBlack'), wh = $('imageRangeWhite');
  if (document.activeElement !== bl) bl.value = formatDisplay(K_BLACK, state.unit);
  if (document.activeElement !== wh) wh.value = formatDisplay(K_WHITE, state.unit);
}

/** 提交图片温度：校验失败则恢复原值并提示原因 */
function commitRange() {
  if (state.busy) { updateRangeInputs(); return; }
  const blV = parseFloatCN($('imageRangeBlack').value);
  const whV = parseFloatCN($('imageRangeWhite').value);
  if (blV === null || whV === null) {
    showError('温度无效', '黑色温度与白色温度都必须是数字（按当前单位 ' + state.unit + ' 填写）。');
    updateRangeInputs();
    return;
  }
  const blackK = fromDisplay(blV, state.unit);
  const whiteK = fromDisplay(whV, state.unit);
  const err = validateImageRange(blackK, whiteK);
  if (err) {
    showError('温度无效', err);
    updateRangeInputs();
    return;
  }
  setRange(blackK, whiteK);          // 只影响灰度->温度，不动色标节点
  // 上限 / 下限是程序比较两个温度后得出的，日志里一并写出来便于核对
  log('图片温度已改为：黑色 ' + formatDisplay(K_BLACK, state.unit) + unitSuffix(state.unit)
    + ' / 白色 ' + formatDisplay(K_WHITE, state.unit) + unitSuffix(state.unit)
    + '（上限 ' + formatDisplay(K_MAX, state.unit) + unitSuffix(state.unit)
    + '，下限 ' + formatDisplay(K_MIN, state.unit) + unitSuffix(state.unit) + '）');
  refreshAll();
}

function addNode() {
  if (state.busy) return;
  const kelvin = largestGapCenter(state.scale);
  const rgb = state.mapper.colorAtKelvin(kelvin);
  openNodeDialog({ node: null, kelvin: kelvin, rgb: rgb }).then(res => {
    if (!res) return;
    const node = makeNode(res.kelvin, res.rgb);
    state.scale.nodes.push(node);
    sortNodes(state.scale.nodes);
    const suffix = unitSuffix(state.unit);
    log('新增节点：' + formatDisplay(node.kelvin, state.unit) + suffix + '，颜色 ' + rgbToHex(node.rgb));
    refreshAll();
  });
}

function editNode(uid) {
  if (state.busy) return;
  const node = findNode(state.scale, uid);
  if (!node) return;
  const oldKelvin = node.kelvin, oldRgb = node.rgb.slice();
  openNodeDialog({ node: node, kelvin: node.kelvin, rgb: node.rgb }).then(res => {
    if (!res) return;
    node.kelvin = res.kelvin;              // 保留节点也可以改位置
    node.rgb = res.rgb;
    sortNodes(state.scale.nodes);
    const changes = [];
    if (roundHalfEven(oldKelvin) !== roundHalfEven(node.kelvin)) {
      changes.push('位置 ' + formatDisplay(oldKelvin, state.unit) + ' → ' + formatDisplay(node.kelvin, state.unit) + unitSuffix(state.unit));
    }
    if (oldRgb.join() !== node.rgb.join()) {
      changes.push('颜色 ' + rgbToHex(oldRgb) + ' → ' + rgbToHex(node.rgb));
    }
    if (changes.length) log('修改节点（' + positionKey(node.kelvin).toFixed(2) + ' K）：' + changes.join('，'));
    refreshAll();
  });
}

function swapNode(uid) {
  if (state.busy) return;
  const nodes = state.scale.nodes;
  const i = indexOfNode(state.scale, uid);
  if (i < 0) return;
  let partner = -1;
  if (i > 0 && positionKey(nodes[i - 1].kelvin) === positionKey(nodes[i].kelvin)) partner = i - 1;
  else if (i + 1 < nodes.length && positionKey(nodes[i + 1].kelvin) === positionKey(nodes[i].kelvin)) partner = i + 1;
  if (partner < 0) return;
  const key = positionKey(nodes[i].kelvin).toFixed(2);
  const tmp = nodes[i]; nodes[i] = nodes[partner]; nodes[partner] = tmp;
  sortNodes(nodes);
  log('已交换 ' + key + ' K 处重叠节点的顺序（硬跳变方向改变）。');
  refreshAll();
}

async function deleteCheckedNodes() {
  if (state.busy) return;
  const uids = [...state.nodeChecked];
  if (!uids.length) {
    await showMessage('删除节点', '请选择节点');   // 没勾选时给出明确提示
    return;
  }
  const nodes = state.scale.nodes;
  // 保留节点不可删除；同时至少要留下一个节点
  const removable = nodes.filter(n => state.nodeChecked.has(n.uid) && !isPinned(n));
  let kept = nodes.filter(n => removable.indexOf(n) < 0);
  if (!kept.length) {
    kept = [nodes[0]];
    log('保留节点不可删除，至少要留下一个节点。');
  }
  const removed = nodes.length - kept.length;
  state.scale.nodes = kept;
  state.nodeChecked.clear();
  if (removed) { log('已删除 ' + removed + ' 个节点。'); refreshAll(); }
  renderNodeCards();
}

/* =========================================================================
 * 第 17 部分：节点编辑对话框
 * ========================================================================= */

let nodeColorEditor = null;

function openNodeDialog(opts) {
  return new Promise(resolve => {
    const dlg = $('nodeDialog');
    const pinned = opts.node ? isPinned(opts.node) : false;
    const posInput = $('nodeDlgPos');
    // 输入框里只填数字，单位由标签给出，并始终跟随当前全局单位
    const originalText = formatDisplay(opts.kelvin, state.unit);

    $('nodeDlgPosLabel').textContent = '位置（' + state.unit + '）';
    posInput.value = originalText;
    posInput.readOnly = false;                 // 保留节点也能改位置
    posInput.style.background = cssVar('--n-0', '#ffffff');
    $('nodeDlgEndpointHint').classList.toggle('hidden', !pinned);
    nodeColorEditor.setColor(opts.rgb);
    dlg.returnValue = 'cancel';

    const onBlur = () => {
      const v = parseFloatCN(posInput.value);
      if (v === null) { posInput.value = originalText; return; }
      const k = fromDisplay(v, state.unit);
      if (k < NODE_K_MIN || k > NODE_K_MAX) { posInput.value = originalText; return; }
      posInput.value = formatDisplay(k, state.unit);
    };
    const onKey = e => { if (e.key === 'Enter') { e.preventDefault(); posInput.blur(); $('nodeDlgOk').click(); } };
    const onOk = e => {
      const v = parseFloatCN(posInput.value);
      if (v === null) { e.preventDefault(); showError('位置无效', '请输入合法的数字。'); return; }
      const kelvin = fromDisplay(v, state.unit);
      const err = validateNewPosition(state.scale, kelvin, opts.node ? opts.node.uid : undefined);
      if (err) { e.preventDefault(); showError('位置无效', err); }
    };
    const onClose = () => {
      posInput.removeEventListener('blur', onBlur);
      posInput.removeEventListener('keydown', onKey);
      $('nodeDlgOk').removeEventListener('click', onOk);
      dlg.removeEventListener('close', onClose);
      if (dlg.returnValue !== 'ok') { resolve(null); return; }
      const v = parseFloatCN(posInput.value);
      const kelvin = (v === null) ? opts.kelvin : fromDisplay(v, state.unit);
      resolve({ kelvin: kelvin, rgb: nodeColorEditor.color.slice() });
    };
    posInput.addEventListener('blur', onBlur);
    posInput.addEventListener('keydown', onKey);
    $('nodeDlgOk').addEventListener('click', onOk);
    dlg.addEventListener('close', onClose);
    dlg.showModal();
  });
}

/* =========================================================================
 * 第 18 部分：配置 JSON 操作
 * ========================================================================= */

/**
 * 横向 legend：左低温、右高温，不画细刻度，只在左右两端标出两端的温度。
 * 温度轴同样取**图片两端的温度**（由程序比较大小得出上限 / 下限），
 * 因此列表里所有色标共用同一根温度轴，便于横向比较。
 */
function drawHScaleLegend(canvas, record) {
  const dpr = fitCanvas(canvas);
  if (!canvas.width) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const upperK = K_MAX, lowerK = K_MIN;      // 图片温度的上限 / 下限（程序比较得出）
  const leftText = String(Math.round(toDisplay(lowerK, state.unit)));
  const rightText = String(Math.round(toDisplay(upperK, state.unit)));
  ctx.font = Math.max(9, Math.round(11 * dpr)) + 'px ' + cssVar('--font-num', 'Consolas, monospace');
  ctx.textBaseline = 'middle';
  const gap = Math.round(8 * dpr);
  const lw = Math.ceil(ctx.measureText(leftText).width);
  const rw = Math.ceil(ctx.measureText(rightText).width);
  const barX = lw + gap;
  const barW = Math.max(16, W - lw - rw - gap * 2);
  const barH = Math.round(12 * dpr);
  const barY = Math.round(H / 2 - barH / 2);

  // 左端 = 温度下限，右端 = 温度上限；色标不足处由 mapper 自动拉伸两端节点色
  const mapper = new ColorMapper(record.nodes);
  const tmp = makeCanvas(barW, 1);
  const tctx = tmp.getContext('2d');
  const img = tctx.createImageData(barW, 1);
  for (let x = 0; x < barW; x++) {
    const t = lowerK + (upperK - lowerK) * ((x + 0.5) / barW);
    const c = mapper.colorAtKelvin(t);
    const o = x * 4;
    img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
  }
  tctx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false;      // 同上：1 像素高的色带不要插值
  ctx.drawImage(tmp, 0, 0, barW, 1, barX, barY, barW, barH);
  ctx.imageSmoothingEnabled = true;
  ctx.strokeStyle = cssVar('--stroke-2', '#d5dae0');
  ctx.lineWidth = 1;
  ctx.strokeRect(barX + 0.5, barY + 0.5, barW - 1, barH - 1);

  ctx.fillStyle = cssVar('--text-2', '#5a626b');
  ctx.textAlign = 'right';
  ctx.fillText(leftText, barX - gap, barY + barH / 2);
  ctx.textAlign = 'left';
  ctx.fillText(rightText, barX + barW + gap, barY + barH / 2);
}

/**
 * 色标库弹窗（我的色标 / 管理色标 / 预设共用）。
 * opts = { title, okLabel, manage, presets, records }
 *   manage=false：单选后按底部右侧按钮载入，resolve { action:'import', raw, parsed } 或 null
 *   manage=true ：顶部有「多选 + 删除」，底部左「取消」右「导入」
 *   presets=true：列表来自传入的 records（PreSet/ 配置文件里的预置），不读本地库；每条不显示创建时间
 */
function openScaleLibraryDialog(records, opts) {
  const manage = !!(opts && opts.manage);
  const presets = !!(opts && opts.presets);
  return new Promise(resolve => {
    const dlg = $('myScalesDialog');
    const list = $('myScalesList');
    const okBtn = $('myScalesOk');
    const cancelBtn = $('myScalesCancel');
    const tools = $('scaleLibTools');
    const multiBox = $('scaleLibMulti');
    const delBtn = $('scaleLibDelete');
    const allBtn = $('scaleLibAll');
    const noneBtn = $('scaleLibNone');
    const copyBtn = $('scaleLibCopy');
    const copyLabel = copyBtn.textContent;   // 正常文案；每次打开弹窗都先恢复成它
    let copyTimer = 0;                       // 「已复制」停留计时
    let copyFadeTimer = 0;                   // 渐隐计时

    $('scaleLibTitle').textContent = (opts && opts.title) || '我的色标';
    okBtn.textContent = (opts && opts.okLabel) || '确定';
    tools.classList.toggle('hidden', !manage);
    multiBox.checked = false;
    okBtn.disabled = true;
    delBtn.disabled = true;
    copyBtn.disabled = true;
    resetCopyLabel();                        // 打开时总是显示原文案

    let entries = [];
    let selectedCreated = null;      // 单选选中的行 key（本地库用 created，预置用行号）
    let multiMode = false;
    const checked = new Set();       // 多选勾选的 created

    /**
     * 行的唯一 key：本地库用 created（毫秒时间戳），预置用**行号** ——
     * 预置文件里没有 created，parseScaleRecord 会临时补一个「当前时间」，
     * 同一毫秒解析多条会撞 key，所以预置一律按行号选。
     */
    const rowKey = (entry, index) => (presets ? index : Number(entry.parsed.created));

    /**
     * 立刻回到「导出到剪贴板」原文案，并中断任何进行中的渐隐动画。
     * （切换选中的色标、切多选、删除、关闭弹窗都会走这里）
     */
    function resetCopyLabel() {
      if (copyTimer) { clearTimeout(copyTimer); copyTimer = 0; }
      if (copyFadeTimer) { clearTimeout(copyFadeTimer); copyFadeTimer = 0; }
      copyBtn.classList.remove('copied', 'fading');
      copyBtn.textContent = copyLabel;
    }

    /** 复制成功后：先显示「已复制」，最多停留 2 秒，再渐隐并切回原文案 */
    function showCopiedFeedback() {
      const HOLD_MS = 2000;      // 「已复制」最多维持 2 秒
      const FADE_MS = 300;       // 之后逐渐隐去
      resetCopyLabel();
      copyBtn.classList.add('copied');
      copyBtn.textContent = '已复制';
      copyBtn.disabled = true;
      copyTimer = setTimeout(() => {
        copyTimer = 0;
        copyBtn.classList.add('fading');
        copyFadeTimer = setTimeout(() => {
          copyFadeTimer = 0;
          resetCopyLabel();
          refreshButtons();
        }, FADE_MS);
      }, HOLD_MS);
    }

    const refreshButtons = () => {
      okBtn.disabled = selectedCreated === null;
      // 「导出到剪贴板」只在单选（选中一条）时可用；多选状态下不可用
      copyBtn.disabled = multiMode || selectedCreated === null;
      if (!manage) return;
      delBtn.disabled = multiMode ? checked.size === 0 : selectedCreated === null;
    };

    const drawAll = () => {
      requestAnimationFrame(() => {
        Array.prototype.forEach.call(list.querySelectorAll('.scale-item'), item => {
          const idx = Number(item.dataset.index);
          const cv = item.querySelector('canvas');
          if (cv && entries[idx]) drawHScaleLegend(cv, entries[idx].parsed);
        });
      });
    };

    function buildList() {
      list.innerHTML = '';
      if (!entries.length) {
        const empty = document.createElement('div');
        empty.className = 'my-scales-empty';
        empty.innerHTML = presets
          ? '<div class="eh-title">没有可用的预设</div>'
            + '<div class="eh-sub">预置来自 ' + PRESET_MANIFEST + ' 里列出的配置文件。'
            + '请确认 PreSet 目录与 index.html 放在一起（日志里有具体原因）；'
            + '也可以用「管理色标 → 从设备导入」把色标 JSON 收进本地色标库。</div>'
          : '<div class="eh-title">还没有保存过色标</div>'
            + '<div class="eh-sub">用「保存色标 → 保存」把当前色标存到这里</div>';
        list.appendChild(empty);
        return;
      }
      entries.forEach((entry, index) => {
        const created = Number(entry.parsed.created);
        const key = rowKey(entry, index);
        const item = document.createElement('div');
        item.className = 'scale-item';
        item.dataset.index = String(index);
        item.dataset.created = String(created);
        item.dataset.key = String(key);
        item.setAttribute('role', 'button');
        item.tabIndex = 0;
        if (!multiMode && selectedCreated === key) item.classList.add('selected');

        if (manage && multiMode) {
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = checked.has(key);
          cb.addEventListener('click', e => e.stopPropagation());
          item.appendChild(cb);
        }

        const body = document.createElement('div');
        body.className = 'si-body';

        const cv = document.createElement('canvas');
        body.appendChild(cv);

        const nm = document.createElement('div');
        nm.className = 'si-name';
        nm.textContent = entry.parsed.name;
        body.appendChild(nm);

        const tm = document.createElement('div');
        tm.className = 'si-time';
        // 预置色标本身没有创建时间（导入那一刻才生成），这里不显示假的时间戳
        tm.textContent = presets ? '预置色标 · 导入时自动记录创建时间' : '创建于' + formatCreatedTime(created);
        body.appendChild(tm);

        item.appendChild(body);

        const activate = () => {
          if (manage && multiMode) {
            if (checked.has(key)) checked.delete(key); else checked.add(key);
            const cb = item.querySelector('input[type=checkbox]');
            if (cb) cb.checked = checked.has(key);
          } else {
            const switched = selectedCreated !== key;
            selectedCreated = key;
            Array.prototype.forEach.call(list.children, c => c.classList.remove('selected'));
            item.classList.add('selected');
            // 焦点色标换了：立刻切回原文案（同一条再点一次不算切换）
            if (switched) resetCopyLabel();
          }
          refreshButtons();
        };
        item.addEventListener('click', activate);
        item.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); }
        });
        list.appendChild(item);
      });
      drawAll();
    }

    const reload = () => {
      entries = [];
      const source = presets ? (records || []) : readScaleStore();
      sortScaleRecords(source).forEach(raw => {
        try { entries.push({ raw: raw, parsed: parseScaleRecord(raw) }); }
        catch (e) { log((presets ? '预置色标' : '本地色标库') + '中有一条记录无效，已跳过：' + e.message); }
      });
    };

    /** 「全选 / 全不选」只在多选状态下出现 */
    const updateTools = () => {
      allBtn.classList.toggle('hidden', !multiMode);
      noneBtn.classList.toggle('hidden', !multiMode);
    };

    function onMultiToggle() {
      multiMode = multiBox.checked;
      selectedCreated = null;
      checked.clear();
      resetCopyLabel();
      updateTools();
      buildList();
      refreshButtons();
    }

    function setAllChecked(on) {
      checked.clear();
      if (on) entries.forEach((e, i) => checked.add(rowKey(e, i)));
      Array.prototype.forEach.call(list.querySelectorAll('.scale-item'), item => {
        const cb = item.querySelector('input[type=checkbox]');
        if (cb) cb.checked = on;
      });
      refreshButtons();
    }

    function onDelete() {
      const targets = manage
        ? (multiMode ? Array.from(checked) : (selectedCreated === null ? [] : [selectedCreated]))
        : [];
      if (!targets.length) return;
      const kept = readScaleStore().filter(r => targets.indexOf(Number(r.created)) < 0);
      if (!writeScaleStore(kept)) {
        showError('删除失败', '无法写入本地存储，色标未被删除。');
        return;
      }
      log('已从「我的色标」中永久删除 ' + targets.length + ' 条色标。');
      selectedCreated = null;
      checked.clear();
      multiMode = false;            // 删除后自动退出多选状态
      multiBox.checked = false;
      resetCopyLabel();
      updateTools();
      reload();
      buildList();
      refreshButtons();
    }
    function cleanup() {
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      delBtn.removeEventListener('click', onDelete);
      allBtn.removeEventListener('click', onAll);
      noneBtn.removeEventListener('click', onNone);
      multiBox.removeEventListener('change', onMultiToggle);
      copyBtn.removeEventListener('click', onCopy);
      dlg.removeEventListener('close', onEsc);
      resetCopyLabel();                     // 关掉弹窗也把文案与动画复位
    }
    function finish(value) {
      cleanup();
      dlg.close();
      resolve(value);
    }
    /** 当前选中的那条（本地库按 created，预置按行号） */
    const selectedEntry = () => entries.filter((e, i) => rowKey(e, i) === selectedCreated)[0];

    function onOk() {
      const entry = selectedEntry();
      finish(entry ? { action: 'import', raw: entry.raw, parsed: entry.parsed } : null);
    }

    /** 「导出到剪贴板」：把选中的那条色标按「另存为」的格式复制成 JSON 文本 */
    async function onCopy() {
      const entry = selectedEntry();
      if (!entry) return;
      const text = scaleToText(scaleFromObject(entry.raw));
      if (await copyTextToClipboard(text)) {
        log('已把色标「' + entry.parsed.name + '」的 JSON 复制到剪贴板（'
          + entry.parsed.nodes.length + ' 个节点）。');
        showCopiedFeedback();
      } else {
        await showError('导出到剪贴板',
          '无法写入剪贴板（浏览器可能不允许，或窗口没有焦点）。\n'
          + '可以改用「保存色标 → 另存为」导出成 JSON 文件。');
      }
    }
    function onAll() { setAllChecked(true); }
    function onNone() { setAllChecked(false); }
    function onCancel() { finish(null); }
    function onEsc() { cleanup(); resolve(null); }

    allBtn.addEventListener('click', onAll);
    noneBtn.addEventListener('click', onNone);

    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    delBtn.addEventListener('click', onDelete);
    multiBox.addEventListener('change', onMultiToggle);
    copyBtn.addEventListener('click', onCopy);
    dlg.addEventListener('close', onEsc);

    reload();
    updateTools();
    buildList();
    refreshButtons();
    dlg.showModal();
    drawAll();
  });
}

/** 「我的色标」：单选一条并载入 */
async function actionMyScales() {
  if (state.busy) return;
  if (!storeAvailable()) {
    await showError('我的色标', '当前浏览器不允许使用本地存储（localStorage），无法保存或读取「我的色标」。');
    return;
  }
  const picked = await openScaleLibraryDialog(sortScaleRecords(readScaleStore()),
    { title: '我的色标', okLabel: '确定', manage: false });
  if (!picked) return;
  await loadScaleRecord(picked.raw, '我的色标');
}

/** 「管理色标」：可多选删除、也可单选导入 */
async function actionManageScales() {
  if (state.busy) return;
  if (!storeAvailable()) {
    await showError('管理色标', '当前浏览器不允许使用本地存储（localStorage），无法管理「我的色标」。');
    return;
  }
  const picked = await openScaleLibraryDialog(sortScaleRecords(readScaleStore()),
    { title: '管理色标', okLabel: '导入', manage: true });
  if (!picked) return;
  await loadScaleRecord(picked.raw, '管理色标');
}

/** 从色标库记录载入为当前色标 */
async function loadScaleRecord(raw, source) {
  if (!await confirmDiscardChanges('打开色标')) return;
  let scale;
  try {
    scale = scaleFromObject(raw);
  } catch (e) {
    await showError('打开失败', '这条色标记录无法使用，当前色标保持不变。\n\n' + e.message);
    log('打开本地色标失败：' + e.message);
    return;
  }
  state.scale = scale;
  state.scaleName = null;
  state.scaleHandle = null;
  state.baseline = scaleToText(scale);
  state.nodeChecked.clear();
  refreshAll();
  updateActionStates();
  log('已从「' + source + '」打开：' + scale.name + '（创建于 ' + formatCreatedTime(scale.created) + '）');
}

function pickFileViaInput(inputId) {
  return new Promise(resolve => {
    const input = $(inputId);
    const onChange = () => {
      input.removeEventListener('change', onChange);
      resolve(input.files && input.files[0] ? input.files[0] : null);
      input.value = '';
    };
    input.addEventListener('change', onChange);
    input.click();
  });
}

/** 一次选多个文件（用于批量导入到色标库） */
function pickFilesViaInput(inputId) {
  return new Promise(resolve => {
    const input = $(inputId);
    const onChange = () => {
      input.removeEventListener('change', onChange);
      resolve(Array.prototype.slice.call(input.files || []));
      input.value = '';
    };
    input.addEventListener('change', onChange);
    input.click();
  });
}

/** 选择若干 JSON 文件并读出文本（优先用原生多选） */
async function pickConfigFiles() {
  if (typeof window.showOpenFilePicker === 'function') {
    try {
      const handles = await window.showOpenFilePicker({
        multiple: true,
        types: [{ description: 'JSON 配置文件', accept: { 'application/json': ['.json'] } }],
      });
      const out = [];
      for (const h of handles) {
        out.push({ name: h.name, text: await (await h.getFile()).text() });
      }
      return out;
    } catch (e) {
      if (e && e.name === 'AbortError') return null;
      await showError('导入失败', '无法读取文件：\n' + e.message);
      return null;
    }
  }
  const files = await pickFilesViaInput('fileConfig');
  if (!files.length) return null;
  const out = [];
  for (const f of files) out.push({ name: f.name, text: await f.text() });
  return out;
}

/**
 * 「管理色标 → 从设备导入」：把设备上的 JSON 配置收进本地色标库（localStorage）。
 * 按 created 时间戳匹配：库里已有同一时间戳就覆盖，否则新增。不会改变当前正在编辑的色标。
 */
async function actionImportToStore() {
  if (state.busy) return;
  if (!storeAvailable()) {
    await showError('从设备导入', '当前浏览器不允许使用本地存储（localStorage），无法导入到「我的色标」。');
    return;
  }
  const picked = await pickConfigFiles();
  if (!picked || !picked.length) return;

  let store = readScaleStore();
  const known = new Set(store.map(r => Number(r.created)));
  const added = [], replaced = [], failed = [];
  for (const f of picked) {
    let rec;
    try {
      rec = parseScaleRecord(JSON.parse(f.text));
    } catch (e) {
      failed.push([f.name, e.message]);
      log('导入失败：' + f.name + '（' + e.message + '）');
      continue;
    }
    const storable = recordToStorable(rec);
    if (known.has(storable.created)) replaced.push(f.name); else added.push(f.name);
    known.add(storable.created);
    store = upsertScaleRecord(store, storable);
  }

  if (!writeScaleStore(store)) {
    await showError('导入失败', '无法写入本地存储，未导入任何色标。');
    return;
  }
  if (added.length || replaced.length) {
    log('从设备导入到「我的色标」：新增 ' + added.length + ' 条，覆盖 ' + replaced.length
      + ' 条，库里现有 ' + store.length + ' 条。');
  }
  if (failed.length) {
    await showError('导入完成',
      '已导入 ' + (added.length + replaced.length) + ' 条到「我的色标」，'
      + failed.length + ' 个文件失败：\n'
      + failed.map(x => x[0] + '：' + x[1]).join('\n'));
    return;
  }
  await showMessage('从设备导入',
    '已导入 ' + (added.length + replaced.length) + ' 条色标到「我的色标」。\n'
    + '可以在「管理色标 → 我的色标」里查看和载入。');
}

/** 丢弃当前未保存修改前先确认（新建色标 / 导入色标都会覆盖当前色标） */
async function confirmDiscardChanges(actionLabel) {
  if (!isDirty()) return true;
  return await askConfirm(
    '色标「' + state.scale.name + '」有未保存的修改，' + actionLabel + '将丢弃这些修改。\n是否继续？',
    '继续', '取消'
  );
}

/**
 * 「打开色标 → 预设」：弹出预置色标列表（样式与「我的色标」一致，底部左「取消」右「导入」），
 * 选一条按「导入」载入成当前色标。列表来自 PreSet/ 下的配置文件，所以先确保载入完成。
 * 预置里没有 created，**按导入时刻生成**（见 presetToScale），
 * 所以导入进来的是一条全新的、可以再「保存」进本地库的色标。
 */
async function actionPresets() {
  if (state.busy) return false;
  await ensurePresetsLoaded();               // 预置是外部配置：第一次打开时载入
  const picked = await openScaleLibraryDialog(presetRecords(),
    { title: '预设', okLabel: '导入', presets: true });
  if (!picked) return false;
  const preset = presetByRow(picked.raw && picked.raw.created);
  if (!preset) {
    await showError('导入失败', '这条预置色标找不到对应数据，当前色标保持不变。');
    return false;
  }
  if (!await confirmDiscardChanges('预设')) return false;
  let scale;
  try {
    scale = presetToScale(preset);          // created = 导入时刻
  } catch (e) {
    await showError('导入失败', '这条预置色标无法使用，当前色标保持不变。\n\n' + e.message);
    log('导入预置色标失败：' + e.message);
    return false;
  }
  state.scale = scale;
  state.scaleName = null;                   // 预置不是设备上的文件
  state.scaleHandle = null;
  state.baseline = scaleToText(scale);
  state.nodeChecked.clear();
  refreshAll();
  updateActionStates();
  log('已从「预设」导入：' + scale.name + '（' + scale.nodes.length + ' 个节点，'
    + '创建时间已按导入时刻记为 ' + formatCreatedTime(scale.created) + '）。');
  return true;
}

async function actionOpen() {
  if (state.busy) return;
  if (!await confirmDiscardChanges('从设备中导入')) return;
  let text = null, name = null, handle = null;
  if (typeof window.showOpenFilePicker === 'function') {
    try {
      const handles = await window.showOpenFilePicker({
        multiple: false,
        types: [{ description: 'JSON 配置文件', accept: { 'application/json': ['.json'] } }],
      });
      handle = handles[0];
      name = handle.name;
      text = await (await handle.getFile()).text();
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      await showError('打开失败', '无法读取文件，当前色标保持不变。\n\n' + e.message);
      log('打开配置失败（读取错误）：' + e.message);
      return;
    }
  } else {
    const file = await pickFileViaInput('fileConfig');
    if (!file) return;
    name = file.name;
    text = await file.text();
  }

  let data;
  try { data = JSON.parse(text); }
  catch (e) {
    await showError('打开失败', 'JSON 解析失败，当前色标保持不变。\n\n' + e.message);
    log('打开配置失败（JSON 解析错误）：' + e.message);
    return;
  }
  let scale;
  try { scale = scaleFromObject(data); }
  catch (e) {
    await showError('打开失败', '配置内容非法，当前色标保持不变。\n\n' + e.message);
    log('打开配置失败（内容非法）：' + e.message);
    return;
  }
  state.scale = scale;
  state.scaleHandle = handle;
  state.scaleName = name;
  state.baseline = scaleToText(scale);
  state.nodeChecked.clear();
  refreshAll();
  log('已打开色标：' + name + '（' + scale.nodes.length + ' 个节点）');
}

/**
 * 「保存」= 存进浏览器本地色标库（localStorage），不碰设备上已打开的文件。
 * 按 created 毫秒时间戳匹配：同一条色标就覆盖，新色标就新增。
 */
function actionSave() {
  if (state.busy) return false;
  if (!storeAvailable()) {
    showError('保存失败', '当前浏览器不允许使用本地存储（localStorage），无法保存到「我的色标」。');
    log('保存失败：本地存储不可用。');
    return false;
  }
  const record = scaleToObject(state.scale);
  const next = upsertScaleRecord(readScaleStore(), record);
  if (!writeScaleStore(next)) {
    showError('保存失败', '无法写入本地存储，可能是浏览器存储空间不足。');
    return false;
  }
  markClean();
  updateActionStates();
  log('已保存到「我的色标」：' + state.scale.name
    + '（创建于 ' + formatCreatedTime(state.scale.created) + '，库里共 ' + next.length + ' 条）');
  return true;
}

/** 「另存为」= 导出一份 JSON 到设备 */
async function actionSaveAs() {
  if (state.busy) return false;
  const suggested = state.scaleName || (state.scale.name + '.json');
  if (typeof window.showSaveFilePicker === 'function') {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: suggested,
        types: [{ description: 'JSON 配置文件', accept: { 'application/json': ['.json'] } }],
      });
      const ok = await writeScale(handle, handle.name);
      if (ok) { state.scaleHandle = handle; state.scaleName = handle.name; }
      return ok;
    } catch (e) {
      if (e && e.name === 'AbortError') return false;
      await showError('保存失败', '无法写入文件：\n' + e.message);
      log('保存失败：' + e.message);
      return false;
    }
  }
  let name = suggested;
  if (!/\.json$/i.test(name)) name += '.json';
  const ok = await writeScale(null, name);
  if (ok) { state.scaleHandle = null; state.scaleName = name; }
  return ok;
}

async function writeScale(handle, name) {
  const text = scaleToText(state.scale);
  try {
    if (handle) await writeTextToHandle(handle, text);
    else downloadBlob(new Blob([text], { type: 'application/json' }), name);
    markClean();
    log('已导出到设备：' + name);
    return true;
  } catch (e) {
    await showError('保存失败', '无法写入文件：\n' + e.message);
    log('保存失败：' + e.message);
    return false;
  }
}

/* ---- 「保存色标 → 导出到剪贴板」：与弹窗里那个按钮同一套文案与反馈节奏 ---- */

const COPY_LABEL = '导出到剪贴板';
const COPY_HOLD_MS = 2000;      // 「已复制」最多停留 2 秒
const COPY_FADE_MS = 300;       // 之后逐渐隐去
let copyLabelTimer = 0;
let copyFadeTimer = 0;

/** 立刻回到「导出到剪贴板」原文案，并中断任何进行中的停留 / 渐隐动画 */
function resetCopyScaleLabel() {
  if (copyLabelTimer) { clearTimeout(copyLabelTimer); copyLabelTimer = 0; }
  if (copyFadeTimer) { clearTimeout(copyFadeTimer); copyFadeTimer = 0; }
  const el = $('miCopyScale');
  if (!el) return;
  el.classList.remove('copied', 'fading');
  el.textContent = COPY_LABEL;
}

/**
 * 「保存色标 → 导出到剪贴板」：把**当前正在编辑的色标**按「另存为」的格式复制成 JSON 文本，
 * 顺序与内容完全一样（同一个 scaleToText），可以直接粘到聊天窗口或用「输入色标」贴回来。
 */
async function actionCopyScale() {
  if (state.busy) return false;
  resetCopyScaleLabel();
  const text = scaleToText(state.scale);
  if (!await copyTextToClipboard(text)) {
    await showError('导出到剪贴板',
      '无法写入剪贴板（浏览器可能不允许，或窗口没有焦点）。\n'
      + '可以改用「保存色标 → 另存为」导出成 JSON 文件。');
    return false;
  }
  log('已把当前色标「' + state.scale.name + '」的 JSON 复制到剪贴板（'
    + state.scale.nodes.length + ' 个节点，内容与「另存为」一致）。');
  const el = $('miCopyScale');
  if (el) {
    el.classList.add('copied');
    el.textContent = '已复制';
    copyLabelTimer = setTimeout(() => {
      copyLabelTimer = 0;
      el.classList.add('fading');
      copyFadeTimer = setTimeout(() => { copyFadeTimer = 0; resetCopyScaleLabel(); }, COPY_FADE_MS);
    }, COPY_HOLD_MS);
  }
  return true;
}

function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}

async function decodeForExport(file) {
  return await decodeImageFile(file);
}

/**
 * 按源文件格式编码导出图：PNG -> 无损 RGBA PNG；JPG/JPEG -> JPEG（质量 0.92）。
 * 只有 JPEG 源才会输出 JPEG，所以不会因为 JPEG 不支持 Alpha 而丢数据。
 */
async function encodeOutputImage(rgba, width, height, jpeg) {
  if (!jpeg) return new Blob([await encodePNG(rgba, width, height)], { type: 'image/png' });
  const cv = makeCanvas(width, height);
  cv.getContext('2d').putImageData(new ImageData(rgba, width, height), 0, 0);
  if (typeof cv.convertToBlob === 'function') {
    return await cv.convertToBlob({ type: 'image/jpeg', quality: 0.92 });
  }
  return await new Promise((resolve, reject) => {
    cv.toBlob(b => (b ? resolve(b) : reject(new Error('JPEG 编码失败'))), 'image/jpeg', 0.92);
  });
}

function saveFileTypes(name) {
  return isJpegName(name)
    ? [{ description: 'JPEG 图片', accept: { 'image/jpeg': ['.jpg', '.jpeg'] } }]
    : [{ description: 'PNG 图片', accept: { 'image/png': ['.png'] } }];
}

function uniqueOutName(name, used) {
  if (!used.has(name.toLowerCase())) { used.add(name.toLowerCase()); return name; }
  const dot = name.lastIndexOf('.');
  const stem = dot > 0 ? name.slice(0, dot) : name;
  const ext = dot > 0 ? name.slice(dot) : '';
  let i = 1, candidate;
  do { candidate = stem + '(' + i + ')' + ext; i++; } while (used.has(candidate.toLowerCase()));
  used.add(candidate.toLowerCase());
  return candidate;
}

async function actionExportCurrent() {
  if (state.busy) return;
  if (state.currentIndex < 0 || !state.entries[state.currentIndex]) {
    await showMessage('导出', '当前没有可导出的图片。');
    return;
  }
  if (!state.grayFull || !state.fullSize) {
    await showMessage('导出', '当前图片尚未加载完成，请稍候再试。');
    return;
  }
  const entry = state.entries[state.currentIndex];
  const jpeg = isJpegName(entry.displayName);
  let blob;
  try {
    const rgba = colorize(state.grayFull, state.alphaFull, state.mapper, state.fullSize.width, state.fullSize.height);
    blob = await encodeOutputImage(rgba, state.fullSize.width, state.fullSize.height, jpeg);
  } catch (e) {
    await showError('导出失败', '导出失败：\n' + e.message);
    log('导出失败：' + entry.displayName + '（' + e.message + '）');
    return;
  }
  if (typeof window.showSaveFilePicker === 'function') {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: entry.displayName,
        types: saveFileTypes(entry.displayName),
      });
      const w = await handle.createWritable();
      await w.write(blob);
      await w.close();
      log('导出成功：' + handle.name);
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      await showError('导出失败', '导出失败：\n' + e.message);
      log('导出失败：' + entry.displayName + '（' + e.message + '）');
      return;
    }
  }
  downloadBlob(blob, entry.displayName);
  log('导出成功：' + entry.displayName);
}

async function uniqueDirName(dir, name) {
  let candidate = name, i = 1;
  for (;;) {
    try { await dir.getDirectoryHandle(candidate); candidate = name + '(' + i + ')'; i++; }
    catch (e) { return candidate; }
  }
}

function setProgress(done, total, current) {
  $('progressInner').style.width = (total ? (done / total * 100) : 0) + '%';
  $('progressLabel').textContent = current
    ? ('正在处理 ' + Math.min(done + 1, total) + ' / ' + total + '：' + current)
    : ('已完成 ' + done + ' / ' + total);
}

async function actionExportBatch() {
  if (state.busy) return;
  const picked = state.entries.filter(e => e.checked);      // 只导出图片列表里勾选的那些
  if (!picked.length) {
    await showMessage('批量导出', '请选择图片');
    return;
  }
  const defaultName = 'IR_Enhance_' + stamp();
  let dirHandle = null;
  if (typeof window.showDirectoryPicker === 'function') {
    try {
      dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      await showError('批量导出', '无法访问所选位置：\n' + e.message);
      return;
    }
  }
  const input = await askText('批量导出', '输出文件夹名称：', defaultName);
  if (input === null) return;
  const folderName = (String(input).trim() || defaultName).replace(/[\\/:*?"<>|]/g, '_');

  state.batchCancel = false;
  setBusy(true);
  $('progressPanel').classList.remove('hidden');
  $('btnCancelExport').disabled = false;
  setProgress(0, picked.length, picked[0].file.name);

  const failures = [];
  const total = picked.length;
  let cancelled = false;

  try {
    if (dirHandle) {
      const unique = await uniqueDirName(dirHandle, folderName);
      const outDir = await dirHandle.getDirectoryHandle(unique, { create: true });
      log('开始批量导出，共 ' + total + ' 张 → ' + unique + '/');
      const used = new Set();
      for (let i = 0; i < total; i++) {
        if (state.batchCancel) { cancelled = true; break; }
        const entry = picked[i];
        setProgress(i, total, entry.file.name);
        await new Promise(r => setTimeout(r, 0));    // 让进度条先刷新
        try {
          const img = await decodeForExport(entry.file);
          const rgba = colorize(img.gray, img.alpha, state.mapper, img.width, img.height);
          const blob = await encodeOutputImage(rgba, img.width, img.height, isJpegName(entry.displayName));
          const fname = uniqueOutName(entry.displayName, used);
          const fh = await outDir.getFileHandle(fname, { create: true });
          const w = await fh.createWritable();
          await w.write(blob);
          await w.close();
          if (fname !== entry.displayName) log('输出文件名冲突，已改名为：' + fname);
        } catch (e) {
          failures.push([entry.file.name, e.message]);
          log('导出失败：' + entry.file.name + '（' + e.message + '）');
        }
      }
    } else {
      // 回退方案：打包成 ZIP 下载（内部带同名的顶层文件夹）
      log('当前浏览器不支持直接写文件夹，改为打包 ZIP 下载：' + folderName + '.zip');
      const zipFiles = [];
      const used = new Set();
      for (let i = 0; i < total; i++) {
        if (state.batchCancel) { cancelled = true; break; }
        const entry = picked[i];
        setProgress(i, total, entry.file.name);
        await new Promise(r => setTimeout(r, 0));
        try {
          const img = await decodeForExport(entry.file);
          const rgba = colorize(img.gray, img.alpha, state.mapper, img.width, img.height);
          const blob = await encodeOutputImage(rgba, img.width, img.height, isJpegName(entry.displayName));
          const fname = uniqueOutName(entry.displayName, used);
          zipFiles.push({ name: folderName + '/' + fname, data: new Uint8Array(await blob.arrayBuffer()) });
        } catch (e) {
          failures.push([entry.file.name, e.message]);
          log('导出失败：' + entry.file.name + '（' + e.message + '）');
        }
      }
      if (!cancelled) {
        downloadBlob(zipStore(zipFiles), folderName + '.zip');
        log('已生成压缩包：' + folderName + '.zip（' + zipFiles.length + ' 个文件）');
      }
    }
  } catch (e) {
    failures.push(['（输出目录）', e.message]);
    log('批量导出中断：' + e.message);
  } finally {
    setBusy(false);
    $('progressPanel').classList.add('hidden');
    $('btnCancelExport').disabled = false;
    if (!cancelled) setProgress(total, total, '');
  }

  if (cancelled) {
    log('批量导出已取消，已成功导出的文件保留。');
    await showMessage('批量导出', '已取消批量导出。\n已经成功导出的文件已保留，未做回滚。');
    return;
  }
  if (!failures.length) {
    log('批量导出完成：导出成功。');
    await showMessage('批量导出', '导出成功');
    return;
  }
  const lines = failures.map(f => f[0] + '：' + f[1]);
  log('批量导出完成，其中 ' + failures.length + ' 个文件失败。');
  await showError('批量导出', '导出完成，但有 ' + failures.length + ' 个文件失败（其余已成功导出）：\n\n' + lines.join('\n'));
}
