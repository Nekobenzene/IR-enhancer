<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light">
<meta name="description" content="离线单文件工具：导入红外灰度 PNG / JPG，按自定义的黑白两端温度做连续色标增强，实时预览并单张或批量导出。">
<title>红外灰度色标增强工具</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f6cbd'/%3E%3Crect x='6' y='6' width='7' height='20' rx='2' fill='%23ffffff'/%3E%3Crect x='18' y='6' width='8' height='9' rx='2' fill='%23ffffff' opacity='.75'/%3E%3Crect x='18' y='17' width='8' height='9' rx='2' fill='%23ffffff' opacity='.4'/%3E%3C/svg%3E">
<style>
  /* =====================================================================
   * 设计系统：Fluent 2（Windows 11）浅色工具界面
   * 单一强调色 / 单一冷灰族 / 统一圆角体系 / 统一 z-index 层级
   * ===================================================================== */
  :root {
    color-scheme: light;             /* 锁死浅色：系统深色模式下控件也不变黑 */
    /* 冷灰阶（唯一灰色族） */
    --n-0: #ffffff;
    --n-1: #fafbfc;
    --n-2: #f3f5f7;
    --n-3: #edf0f3;
    --n-4: #e3e7eb;
    --n-5: #d5dae0;
    --n-6: #c3c9d0;
    --n-7: #a5adb6;
    --n-8: #7b838c;
    --n-9: #5a626b;
    --n-10: #3b4249;
    --n-11: #24292e;

    /* 文字 */
    --text-1: var(--n-11);
    --text-2: var(--n-9);
    --text-3: var(--n-8);

    /* 唯一强调色（Fluent brand blue，饱和度 < 80%） */
    --accent: #0f6cbd;
    --accent-hover: #115ea3;
    --accent-pressed: #0e4f82;
    --accent-soft: #e5f1fb;
    --accent-soft-2: #cfe4f8;
    --danger: #c42b1c;               /* Windows 经典删除红 */
    --danger-hover: #a82214;
    --danger-pressed: #8f1c10;

    /* 描边 */
    --stroke-1: var(--n-4);
    --stroke-2: var(--n-5);
    --stroke-3: var(--n-6);

    /* 阴影：一律带蓝灰色调，不用纯黑 */
    --shadow-2: 0 1px 2px rgba(16, 42, 67, .10), 0 0 2px rgba(16, 42, 67, .06);
    --shadow-8: 0 8px 16px rgba(16, 42, 67, .14), 0 0 2px rgba(16, 42, 67, .10);
    --shadow-16: 0 16px 32px rgba(16, 42, 67, .18), 0 0 2px rgba(16, 42, 67, .12);

    /* 圆角体系（Shape Consistency Lock）：
       控件 4px / 面板与卡片 6px / 对话框 8px，无胶囊 */
    --r-control: 4px;
    --r-surface: 6px;
    --r-dialog: 8px;

    /* z-index 层级 */
    --z-swap: 2;
    --z-menu: 100;
    --z-dialog: 200;

    --font-ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system,
               "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    --font-num: "Cascadia Mono", Consolas, "SFMono-Regular", ui-monospace, monospace;
    --ease: cubic-bezier(.33, 0, .67, 1);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }
  html { -webkit-text-size-adjust: 100%; }   /* 横屏时不放大字号 */
  body {
    margin: 0; overflow: hidden;
    background: var(--n-2); color: var(--text-1);
    font: 13px/1.45 var(--font-ui);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;    /* 触屏上不要「下拉刷新」打断预览操作 */
  }
  /* 数字一律等宽对齐：温度读数变化时不会左右跳动 */
  .num, #previewInfo, #logView, #progressLabel, #legendCanvas + * { font-variant-numeric: tabular-nums; }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  /* ---------------- 菜单栏 ---------------- */
  #menubar {
    flex: 0 0 auto; display: flex; align-items: stretch;
    background: var(--n-1); border-bottom: 1px solid var(--stroke-1);
    user-select: none;
  }
  .menu { position: relative; display: flex; }
  .menu > .mt {
    display: flex; align-items: center; padding: 0 12px; height: 30px;
    cursor: default; border-radius: var(--r-control); margin: 2px;
    transition: background-color .12s var(--ease);
  }
  .menu:hover > .mt, .menu.open > .mt { background: var(--accent-soft); }
  .menu.open > .mt { background: var(--accent-soft-2); }
  .menu .dd {
    display: none; position: absolute; top: calc(100% + 1px); left: 0; min-width: 196px;
    background: var(--n-0); border: 1px solid var(--stroke-1); border-radius: var(--r-surface);
    box-shadow: var(--shadow-8); z-index: var(--z-menu); padding: 4px; margin-top: 2px;
  }
  .menu.open .dd { display: block; }
  .dd .mi {
    padding: 6px 12px; cursor: default; white-space: nowrap; border-radius: var(--r-control);
    transition: background-color .12s var(--ease);
  }
  .dd .mi:hover { background: var(--accent-soft); }
  .dd .mi:active { background: var(--accent-soft-2); }
  .dd .mi.disabled { color: var(--text-3); }
  .dd .mi.disabled:hover, .dd .mi.disabled:active { background: none; }
  .dd .sep { height: 1px; background: var(--stroke-1); margin: 4px 6px; }

  /* 面板里的下拉按钮组（打开色标 / 保存色标 / 导出图片） */
  .dropbtn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 4px 12px; white-space: nowrap;
  }
  .menu.open > .dropbtn, .menu.open > .mt {
    background: var(--accent-soft); border-color: var(--accent);
  }
  .caret {
    width: 5px; height: 5px; flex: 0 0 auto; margin-top: -2px;
    border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
    transform: rotate(45deg);
  }
  .btn-row { display: flex; gap: 6px; }
  .btn-row > .menu { flex: 1 1 0; min-width: 0; }
  .row > .menu.grow { flex: 1 1 auto; min-width: 0; }
  .dd.dd-block { width: 100%; min-width: 0; }
  .menubar-btn {
    margin: 2px 6px; padding: 3px 12px; background: transparent; border-color: transparent;
    color: var(--text-2);
  }
  .menubar-btn:hover:not(:disabled) { background: var(--accent-soft); border-color: transparent; }
  #menubar .grow { flex: 1 1 auto; }

  /* ---------------- 主区域 ---------------- */
  #main {
    flex: 1 1 auto; min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 340px 270px; gap: 8px; padding: 8px 8px 6px;
  }
  #previewPane, #scalePane, #imagePane {
    display: flex; flex-direction: column; min-height: 0; gap: 6px;
  }
  .pane-head {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    min-height: 24px;
  }
  .muted { color: var(--text-2); }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 面板小标题：工具里的结构性标签，比浮动灰字更有归属感 */
  .pane-title {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; color: var(--text-2);
    letter-spacing: .01em;
  }
  .pane-title::before {
    content: ""; width: 3px; height: 12px; border-radius: 2px; background: var(--accent);
    opacity: .85;
  }
  .pane-rule { height: 1px; background: var(--stroke-1); }
  .pane-head label {
    display: flex; align-items: center; gap: 5px; color: var(--text-2); cursor: pointer;
  }
  .pane-head label:hover { color: var(--text-1); }
  /* 图片温度（黑色端 / 白色端）：放在预览标题与「重置视图」之间 */
  .range-inline {
    display: flex; align-items: center; gap: 6px; flex: 0 0 auto;
    color: var(--text-2); white-space: nowrap;
  }
  .range-inline input {
    width: 68px; text-align: right; font-variant-numeric: tabular-nums;
  }

  /* 预览：透明区域显示棋盘格，直观表达 Alpha */
  #previewWrap {
    flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden;
    background-color: var(--n-1);
    border: 1px solid var(--stroke-1); border-radius: var(--r-surface);
    box-shadow: inset 0 1px 2px rgba(16, 42, 67, .06);
  }
  #previewWrap.checker {
    background-color: var(--n-0);
    background-image:
      linear-gradient(45deg, var(--n-3) 25%, transparent 25%, transparent 75%, var(--n-3) 75%),
      linear-gradient(45deg, var(--n-3) 25%, transparent 25%, transparent 75%, var(--n-3) 75%);
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
  }
  #previewWrap.loading::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(100deg, transparent 20%, rgba(15, 108, 189, .10) 50%, transparent 80%);
    background-size: 220% 100%;
    animation: sweep 1.15s linear infinite;
  }
  @keyframes sweep {
    from { background-position: 140% 0; }
    to { background-position: -40% 0; }
  }
  #previewCanvas { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Fit（整图可见）时单指纵向滑动让给页面滚动；放大之后才由画布接管拖动平移 */
  #previewCanvas.preview-scrollable { touch-action: pan-y; }

  /* 温度输入以下：左边更长的色标柱，右边节点卡片，两列并排 */
  #scaleBody {
    flex: 1 1 auto; min-height: 0;
    display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px;
  }
  #legendWrap { min-height: 0; position: relative; }
  /* 色标柱直接落在灰色背景上，不再套一圈白底 */
  #legendCanvas { display: block; width: 100%; height: 100%; }
  #nodeColumn { display: flex; flex-direction: column; min-height: 0; gap: 6px; }

  /* ---------------- 表单控件 ---------------- */
  .row { display: flex; align-items: center; gap: 6px; }
  .row > label { flex: 0 0 auto; color: var(--text-2); }
  .row > .grow { flex: 1 1 auto; min-width: 0; }
  input[type=text], input[type=number], select {
    font: inherit; padding: 3px 6px; color: var(--text-1);
    border: 1px solid var(--stroke-2); border-radius: var(--r-control);
    background: var(--n-0); transition: border-color .12s var(--ease), box-shadow .12s var(--ease);
  }
  input[type=text]:hover:not(:disabled), input[type=number]:hover:not(:disabled),
  select:hover:not(:disabled) { border-color: var(--stroke-3); }
  input[type=text]:focus, input[type=number]:focus, select:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }
  input:disabled, select:disabled { background: var(--n-2); color: var(--text-3); }
  input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; margin: 0 2px 0 0; }
  #scaleName, #imageRangeBlack, #imageRangeWhite, .hex-input, .rgb-input {
    font-variant-numeric: tabular-nums;
  }

  /* 按钮三档：默认（次级）/ 主操作 / 卡片内的轻量按钮 */
  button {
    font: inherit; padding: 4px 12px; color: var(--text-1);
    border: 1px solid var(--stroke-2); border-radius: var(--r-control);
    background: var(--n-0); cursor: default;
    transition: background-color .12s var(--ease), border-color .12s var(--ease),
                box-shadow .12s var(--ease), transform .06s var(--ease);
  }
  button:hover:not(:disabled) { background: var(--n-2); border-color: var(--stroke-3); }
  button:active:not(:disabled) { background: var(--n-3); transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button:disabled { color: var(--text-3); background: var(--n-2); border-color: var(--stroke-1); }
  /* 每种语境只允许一个主操作；「确定」类按钮可用时为 Windows 经典蓝 */
  .btn-primary {
    color: #fff; background: var(--accent); border-color: var(--accent);
    box-shadow: var(--shadow-2);
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-primary:active:not(:disabled) { background: var(--accent-pressed); border-color: var(--accent-pressed); }
  /* 「删除」类按钮可用时为 Windows 经典红 */
  .btn-danger {
    color: #fff; background: var(--danger); border-color: var(--danger);
    box-shadow: var(--shadow-2);
  }
  .btn-danger:hover:not(:disabled) { background: var(--danger-hover); border-color: var(--danger-hover); }
  .btn-danger:active:not(:disabled) { background: var(--danger-pressed); border-color: var(--danger-pressed); }
  /* 禁用时统一回到经典浅灰 */
  .btn-primary:disabled, .btn-danger:disabled {
    color: var(--text-3); background: var(--n-2); border-color: var(--stroke-1); box-shadow: none;
  }
  .selbtns { display: none; }
  .selbtns.show { display: flex; gap: 6px; }
  .hidden { display: none !important; }
  /* 批量导出期间：被锁定的区域整体降一级，明确「现在不能操作」 */
  #app.busy #nodeList, #app.busy #imageList, #app.busy #previewWrap {
    opacity: .55; filter: saturate(.6);
  }
  #app.busy #nodeList, #app.busy #imageList, #app.busy #previewWrap {
    transition: opacity .15s var(--ease);
  }

  /* ---------------- 节点列表 ---------------- */
  #nodeList {
    flex: 1 1 auto; min-height: 0; overflow: auto;
    background: var(--n-0); border: 1px solid var(--stroke-1); border-radius: var(--r-surface);
    padding: 2px;
  }
  /* 密度 7：不用「边框+白底+圆角」的通用卡片，改成扁平行 + 发丝线 */
  .node-card {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    border-bottom: 1px solid var(--n-3); cursor: pointer;
    transition: background-color .12s var(--ease);
  }
  .node-card:last-child { border-bottom: none; }
  .node-card:hover { background: var(--n-2); }
  .node-card:active { background: var(--n-3); }
  .node-card .swatch {
    width: 20px; height: 20px; flex: 0 0 auto;
    border: 1px solid var(--stroke-3); border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .55);
  }
  .node-card .pos {
    flex: 1 1 auto; min-width: 0; font-variant-numeric: tabular-nums;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .node-card .tag { color: var(--text-3); font-size: 11px; flex: 0 0 auto; }
  .node-card input[type=checkbox] { flex: 0 0 auto; }

  /* 温度相同的两个节点：共边框并置成一个单元，双箭头骑在分界线上 */
  .node-group {
    position: relative; margin: 4px 2px; background: var(--n-0);
    border: 1px solid var(--stroke-2); border-radius: var(--r-surface);
    overflow: hidden; box-shadow: var(--shadow-2);
  }
  .node-group .node-card { border-bottom: none; }
  .node-group .node-card + .node-card { border-top: 1px solid var(--stroke-2); }
  .node-group .node-card:hover { background: var(--accent-soft); }
  .node-group .node-swap {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 22px; height: 22px; margin: 0; padding: 0; z-index: var(--z-swap);
    display: flex; align-items: center; justify-content: center; color: var(--text-2);
    border: 1px solid var(--stroke-3); border-radius: var(--r-control);
    background: var(--n-0); box-shadow: var(--shadow-2); line-height: 0; cursor: pointer;
  }
  .node-group .node-swap:hover {
    background: var(--accent-soft); border-color: var(--accent); color: var(--accent);
  }
  .node-group .node-swap:active { transform: translate(-50%, -50%) translateY(1px); }
  .node-group .node-swap svg { display: block; }

  /* ---------------- 图片列表 ---------------- */
  #imageList {
    flex: 1 1 auto; min-height: 0; overflow: auto;
    background: var(--n-0); border: 1px solid var(--stroke-1); border-radius: var(--r-surface);
  }
  .img-row {
    display: flex; align-items: center; gap: 8px; padding: 5px 8px; cursor: pointer;
    border-bottom: 1px solid var(--n-3); border-left: 3px solid transparent;
    transition: background-color .12s var(--ease), border-color .12s var(--ease);
  }
  .img-row:last-child { border-bottom: none; }
  .img-row:hover { background: var(--n-2); }
  .img-row:active { background: var(--n-3); }
  .img-row.current { background: var(--accent-soft); border-left-color: var(--accent); }
  .img-row.current .name { font-weight: 600; }
  .img-row .thumbBox {
    flex: 0 0 auto; width: 76px; height: 56px; display: flex;
    align-items: center; justify-content: center; overflow: hidden;
    background: var(--n-1); border: 1px solid var(--stroke-1); border-radius: var(--r-control);
  }
  .img-row .thumbBox canvas { max-width: 74px; max-height: 54px; object-fit: contain; }
  .img-row .name {
    flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .img-row input[type=checkbox] { flex: 0 0 auto; }

  /* 空状态：说明怎么开始，而不是丢一行灰字 */
  .empty-hint {
    margin: 10px; padding: 20px 12px; text-align: center;
    border: 1px dashed var(--stroke-2); border-radius: var(--r-surface);
    background: var(--n-1); color: var(--text-2);
  }
  .empty-hint .eh-art {
    width: 40px; height: 30px; margin: 0 auto 10px;
    border: 1.5px solid var(--stroke-3); border-radius: 3px;
    background:
      linear-gradient(135deg, transparent 46%, var(--stroke-3) 46%, var(--stroke-3) 54%, transparent 54%),
      linear-gradient(45deg, transparent 60%, var(--accent-soft-2) 60%);
  }
  .empty-hint .eh-title { font-weight: 600; color: var(--text-1); }
  .empty-hint .eh-sub { margin-top: 4px; font-size: 12px; color: var(--text-3); }

  /* ---------------- 进度 / 日志 ---------------- */
  #progressPanel {
    flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 2px 12px 6px;
  }
  #progressOuter {
    flex: 0 0 260px; height: 8px; background: var(--n-4);
    border-radius: 4px; overflow: hidden;
  }
  #progressInner {
    height: 100%; width: 0%; border-radius: 4px; background: var(--accent);
    transition: width .18s var(--ease);
  }
  #progressLabel {
    flex: 1 1 auto; color: var(--text-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  #logPane {
    flex: 0 0 auto; height: 168px; padding: 0 8px 8px;
    display: flex; flex-direction: column; gap: 6px;
  }
  #logView {
    flex: 1 1 auto; min-height: 0; overflow: auto; padding: 6px 8px;
    background: var(--n-0); border: 1px solid var(--stroke-1); border-radius: var(--r-surface);
    font: 12px/1.5 var(--font-num); white-space: pre-wrap; word-break: break-all;
    color: var(--text-2);
  }

  /* ---------------- 对话框 ---------------- */
  dialog {
    border: 1px solid var(--stroke-2); border-radius: var(--r-dialog); padding: 0;
    background: var(--n-1); color: inherit; font: inherit; max-width: 92vw;
    box-shadow: var(--shadow-16);
  }
  dialog::backdrop { background: rgba(16, 42, 67, .22); }
  .dlg-body { padding: 16px 18px 12px; display: flex; flex-direction: column; gap: 12px; }
  /* 表单：标签在上、帮助文字在下，不用占位符当标签 */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > label { font-size: 12px; color: var(--text-2); }
  .field > input[type=text] { width: 100%; }
  .dlg-foot {
    display: flex; justify-content: flex-end; gap: 8px;
    padding: 10px 18px 14px; border-top: 1px solid var(--stroke-1);
  }
  .dlg-foot button { min-width: 80px; white-space: nowrap; }
  .dlg-foot-split { justify-content: space-between; }
  .dlg-title { font-size: 14px; font-weight: 600; }
  #myScalesDialog { width: 480px; }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .dlg-tools { display: flex; align-items: center; gap: 10px; }
  .dlg-tools label {
    display: flex; align-items: center; gap: 5px; color: var(--text-2); cursor: pointer;
  }
  .dlg-tools label:hover { color: var(--text-1); }

  /* 我的色标：每条 = 横向 legend + 名称 + 创建时间 */
  .my-scales {
    max-height: 52vh; overflow: auto; display: flex; flex-direction: column; gap: 8px;
    min-height: 120px;
  }
  .scale-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 12px; background: var(--n-0);
    border: 1px solid var(--stroke-2); border-radius: var(--r-surface);
    cursor: pointer; transition: background-color .12s var(--ease), border-color .12s var(--ease);
  }
  .scale-item > input[type=checkbox] { margin-top: 4px; flex: 0 0 auto; }
  .scale-item .si-body { flex: 1 1 auto; min-width: 0; }
  .scale-item:hover { background: var(--accent-soft); border-color: var(--accent); }
  .scale-item.selected {
    background: var(--accent-soft); border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent) inset;
  }
  .scale-item canvas { display: block; width: 100%; height: 22px; }
  .scale-item .si-name {
    margin-top: 8px; font-weight: 600; color: var(--text-1);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .scale-item .si-time { margin-top: 2px; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .my-scales-empty {
    padding: 28px 12px; text-align: center; color: var(--text-2);
    border: 1px dashed var(--stroke-2); border-radius: var(--r-surface); background: var(--n-0);
  }
  .my-scales-empty .eh-sub { margin-top: 6px; font-size: 12px; color: var(--text-3); }

  /* ---------------- 使用说明（帮助）：左侧分节目录 + 右侧渲染后的 Markdown ---------------- */
  #helpDialog { width: 900px; }
  .help-wrap {
    display: flex; gap: 18px; align-items: stretch;
    height: min(64vh, 560px); min-height: 240px;
  }
  .help-nav {
    flex: 0 0 196px; overflow: auto; display: flex; flex-direction: column; gap: 2px;
    padding: 0 10px 0 0; border-right: 1px solid var(--stroke-1);
  }
  .help-nav .hn-group { display: flex; flex-direction: column; gap: 2px; }
  .help-nav button {
    display: flex; align-items: baseline; gap: 2px;
    text-align: left; border: 1px solid transparent; background: transparent;
    padding: 8px 10px; border-radius: var(--r-control); color: var(--text-2);
    font-size: 13px; line-height: 1.5; cursor: pointer;
    overflow: hidden; white-space: nowrap;
  }
  .help-nav button:hover { background: var(--n-2); color: var(--text-1); }
  .help-nav button.active {
    background: var(--accent-soft); border-color: var(--accent); color: var(--accent);
    font-weight: 600; box-shadow: inset 3px 0 0 var(--accent);
  }
  .help-nav .hn-top { font-weight: 600; }                       /* 章名加粗 */
  .help-nav .hn-caret { flex: 0 0 12px; color: var(--text-3); font-size: 10px; font-weight: 400; }
  .help-nav .hn-label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* 小节默认不显示，点开所属章节后才展开；小节文字保持常规字重 */
  .help-nav .hn-sub { display: none; padding-left: 24px; font-size: 12.5px; font-weight: 400; }
  .help-nav .hn-group.open .hn-sub { display: flex; }
  .help-doc {
    flex: 1 1 auto; min-width: 0; overflow: auto; padding-right: 10px;
    color: var(--text-1); font-size: 13px; line-height: 1.75;
  }
  .help-doc h1 { font-size: 19px; margin: 0 0 10px; }
  .help-doc h2 {
    font-size: 15px; margin: 22px 0 8px; padding-top: 8px;
    border-top: 1px solid var(--stroke-1);
  }
  .help-doc h2:first-of-type { margin-top: 16px; border-top: none; padding-top: 0; }
  .help-doc h3 { font-size: 13.5px; margin: 16px 0 6px; }
  .help-doc p { margin: 8px 0; }
  .help-doc ul, .help-doc ol { margin: 8px 0; padding-left: 22px; }
  .help-doc li { margin: 3px 0; }
  .help-doc code {
    padding: 1px 5px; border-radius: 4px; background: var(--n-3);
    border: 1px solid var(--stroke-1); font: 12px/1.5 var(--font-num);
  }
  .help-doc pre {
    margin: 10px 0; padding: 10px 12px; background: var(--n-0);
    border: 1px solid var(--stroke-1); border-radius: var(--r-surface); overflow: auto;
  }
  .help-doc pre code { padding: 0; border: none; background: transparent; font-size: 12px; }
  .help-doc blockquote {
    margin: 10px 0; padding: 8px 12px; background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    border-radius: 0 var(--r-control) var(--r-control) 0; color: var(--text-2);
  }
  .help-doc blockquote p { margin: 0; }
  .help-doc table { border-collapse: collapse; margin: 10px 0; width: 100%; font-size: 12.5px; }
  .help-doc th, .help-doc td {
    border: 1px solid var(--stroke-2); padding: 5px 8px; text-align: left; vertical-align: top;
  }
  .help-doc th { background: var(--n-2); font-weight: 600; }
  .help-doc hr { border: none; border-top: 1px solid var(--stroke-1); margin: 18px 0; }
  .help-doc a { color: var(--accent); }
  /* 说明文档源码：不显示、不执行，只作为渲染器的输入 */
  #helpMarkdown { display: none; }

  .color-editor { display: flex; gap: 16px; align-items: flex-start; }
  /* 色块本身就是原生 <input type="color">：点击即可打开 Windows 原生取色器 */
  .color-preview {
    width: 64px; height: 64px; flex: 0 0 auto; padding: 0; margin: 0;
    border: 1px solid var(--stroke-3); border-radius: var(--r-control);
    background: var(--n-0); cursor: pointer; box-shadow: var(--shadow-2);
    -webkit-appearance: none; appearance: none;
  }
  .color-preview::-webkit-color-swatch-wrapper { padding: 2px; }
  .color-preview::-webkit-color-swatch { border: none; border-radius: 2px; }
  .color-preview::-moz-color-swatch { border: none; border-radius: 2px; }
  .color-right { display: flex; flex-direction: column; gap: 8px; }
  .color-right .row { gap: 8px; }
  .hex-input { width: 96px; font-family: var(--font-num); }
  .rgb-input { width: 62px; font-family: var(--font-num); }
  /* 「导出到剪贴板」：复制成功后短暂显示「已复制」，2 秒后渐隐再切回原文案。
     固定最小宽度，避免文案变短时按钮与右边的「确定 / 导入」左右跳动。 */
  #scaleLibCopy {
    min-width: 104px;
    transition: background-color .12s var(--ease), border-color .12s var(--ease),
                color .12s var(--ease), opacity .3s var(--ease);
  }
  #scaleLibCopy.copied {
    color: var(--accent); border-color: var(--accent); background: var(--accent-soft);
  }
  #scaleLibCopy.fading { opacity: 0; }
  /* 「保存色标 → 导出到剪贴板」：菜单项用同一套反馈（停留 2 秒 → 渐隐 → 复原）。
     复制成功后菜单先不收起，让「已复制」看得见；菜单一关就立刻复原。 */
  #miCopyScale {
    transition: background-color .12s var(--ease), color .12s var(--ease), opacity .3s var(--ease);
  }
  #miCopyScale.copied { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  #miCopyScale.fading { opacity: 0; }

  .hint { color: var(--text-2); font-size: 12px; }
  /* 输入色标：粘贴 JSON 的多行文本框 + 行内错误 */
  #textScaleDialog { width: 560px; }
  #textScaleArea {
    width: 100%; min-height: 200px; box-sizing: border-box; resize: vertical;
    font: 12px/1.5 var(--font-num); padding: 6px 8px; color: var(--text-1);
    border: 1px solid var(--stroke-2); border-radius: var(--r-control); background: var(--n-0);
    white-space: pre; overflow: auto; tab-size: 2;
  }
  #textScaleArea:hover { border-color: var(--stroke-3); }
  #textScaleArea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .err {
    color: var(--danger); font-size: 12px; white-space: pre-wrap;
    background: #fdf3f2; border: 1px solid #f1c9c5;
    border-radius: var(--r-control); padding: 6px 8px;
  }
  #msgTitle { font-weight: 600; }
  #msgText { color: var(--text-2); }

  /* ---------------- 滚动条 ---------------- */
  * { scrollbar-width: thin; scrollbar-color: var(--n-6) transparent; }
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--n-6); border: 3px solid var(--n-0); border-radius: 8px;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--n-7); }

  /* =====================================================================
   * 移动端适配：响应式布局 + 触控手势（桌面宽屏 + 鼠标的布局完全不变）
   *   ≤1180px        窄桌面 / 大平板横屏：三栏保留，两侧收窄
   *   ≤900px         平板竖屏 / 手机：改成单栏纵向流，整页滚动
   *   ≤560px         手机细节：标题换行、下拉不出屏、输入框防 iOS 聚焦放大
   *   pointer:coarse 任何触屏设备：点击目标放大到 36px
   * ===================================================================== */
  @media (max-width: 1180px) {
    #main { grid-template-columns: minmax(0, 1fr) 300px 236px; }
  }

  @media (max-width: 900px) {
    html, body { height: auto; }
    body { overflow-x: hidden; overflow-y: auto; }
    #app { height: auto; min-height: 100vh; min-height: 100dvh; }
    #main {
      display: flex; flex-direction: column; gap: 10px; min-height: 0;
      padding: 10px max(10px, env(safe-area-inset-right))
               max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    }
    #previewPane, #scalePane, #imagePane { flex: 0 0 auto; }
    /* 预览占约半屏，其余内容交给页面滚动 */
    #previewWrap { flex: 0 0 auto; height: clamp(220px, 46vh, 420px); height: clamp(220px, 46dvh, 420px); }
    /* 色标列：色标柱与节点卡片必须同高，给一个确定高度让节点列表自己滚动 */
    #scaleBody {
      flex: 0 0 auto; grid-template-columns: 56px minmax(0, 1fr);
      height: clamp(300px, 50vh, 460px); height: clamp(300px, 50dvh, 460px);
    }
    #imageList { flex: 0 0 auto; max-height: 52vh; }
    #logPane { height: auto; }
    #logView { flex: 0 0 auto; height: 132px; }
    #progressPanel { flex-wrap: wrap; row-gap: 6px; }
    #progressOuter { flex: 1 1 140px; }
    /* 弹窗不超出视口；「使用说明」的目录从左侧栏改成上方一栏 */
    dialog { max-width: 94vw; max-height: 92vh; max-height: 92dvh; }
    .dlg-head { flex-wrap: wrap; row-gap: 6px; }
    .help-wrap { flex-direction: column; gap: 10px; height: min(66vh, 560px); height: min(66dvh, 560px); }
    .help-nav {
      flex: 0 0 auto; max-height: 34%; padding: 0 0 8px;
      border-right: none; border-bottom: 1px solid var(--stroke-1);
    }
    .help-doc { padding-right: 0; }
    .my-scales { max-height: 46vh; }
  }

  /* 触屏：点击目标至少 36px（Fluent 触控尺寸），行高与色块同步放大 */
  @media (pointer: coarse) {
    #app { -webkit-tap-highlight-color: transparent; }   /* 用 :active 态表达按下，去掉系统灰块 */
    button, .dd .mi { -webkit-user-select: none; user-select: none; }   /* 长按不要选中按钮文字 */
    button:not(.node-swap) { min-height: 36px; }
    .dd .mi { padding: 9px 12px; }
    .node-card { padding: 9px 8px; }
    .node-card .swatch { width: 24px; height: 24px; }
    .img-row { padding: 8px; }
    input[type=checkbox] { width: 18px; height: 18px; }
    .node-group .node-swap { width: 32px; height: 32px; }
    .color-preview { width: 72px; height: 72px; }
  }

  @media (max-width: 560px) {
    body { font-size: 14px; }
    /* 预览标题行：图片信息独占一行，温度输入与「重置视图」排下一行 */
    .pane-head { flex-wrap: wrap; row-gap: 6px; }
    #previewInfo { flex: 1 1 100%; }
    .range-inline { flex: 1 1 auto; gap: 4px; }
    .range-inline input { width: 74px; }
    .btn-row { gap: 4px; }
    .dropbtn { padding: 6px 8px; }
    /* 下拉菜单不超出屏幕：宽度按内容，最右侧那个改成往左展开 */
    .menu .dd { min-width: 0; width: max-content; max-width: calc(100vw - 24px); }
    .btn-row > .menu:last-child .dd { left: auto; right: 0; }
    .node-card { padding: 9px 8px; }
    .img-row { padding: 8px; }
    /* 输入框字号 < 16px 时 iOS 会在聚焦时放大整页 */
    input[type=text], input[type=number], select, #textScaleArea { font-size: 16px; }
    #textScaleArea { min-height: 150px; }
    .dlg-body { padding: 14px 12px 10px; gap: 10px; }
    .dlg-foot { flex-wrap: wrap; row-gap: 8px; padding: 10px 12px 12px; }
    .dlg-foot button { min-width: 72px; }
    .color-editor { gap: 10px; }
    .color-right .row { gap: 6px; }
    .hex-input { width: 92px; }
    .rgb-input { width: 56px; }
    .empty-hint { margin: 8px; padding: 16px 10px; }
  }

  /* ---------------- 无障碍：尊重系统的「减少动态效果」 ---------------- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
    #previewWrap.loading::after { display: none; }
  }
</style>
</head>
<body>
<div id="app">

  <div id="menubar">
    <button type="button" class="menubar-btn" id="btnHelp" data-act="help"
            title="打开使用说明">帮助</button>
    <span class="grow"></span>
    <button type="button" class="menubar-btn" data-act="quit">退出</button>
  </div>

  <div id="main">
    <!-- 预览 -->
    <section id="previewPane">
      <div class="pane-head">
        <div id="previewInfo" class="muted ellipsis">请添加 PNG / JPG 图片</div>
        <div class="range-inline">
          <span id="imageRangeLabel">温度（°C）</span>
          <label for="imageRangeBlack">黑色温度</label>
          <input type="text" id="imageRangeBlack" title="灰度值 0（纯黑）对应的温度">
          <label for="imageRangeWhite">白色温度</label>
          <input type="text" id="imageRangeWhite" title="灰度值 255（纯白）对应的温度">
        </div>
        <button id="btnResetView" title="只重置缩放与平移，不改变色标与图片">重置视图</button>
      </div>
      <div id="previewWrap"><canvas id="previewCanvas"></canvas></div>
    </section>

    <!-- 色标 -->
    <section id="scalePane">
      <div class="btn-row">
        <div class="menu">
          <button type="button" class="dropbtn" id="btnOpenScale">打开色标<i class="caret"></i></button>
          <div class="dd">
            <div class="mi" data-act="presets">预设</div>
            <div class="mi" data-act="myScales">我的色标</div>
            <div class="mi" data-act="open">从设备中导入</div>
            <div class="mi" data-act="inputScale">输入色标</div>
          </div>
        </div>
        <div class="menu">
          <button type="button" class="dropbtn" id="btnManageScales">管理色标<i class="caret"></i></button>
          <div class="dd">
            <div class="mi" data-act="manageScales">我的色标</div>
            <div class="mi" data-act="importToStore">从设备导入</div>
          </div>
        </div>
        <div class="menu">
          <button type="button" class="dropbtn" id="btnSaveScale">保存色标<i class="caret"></i></button>
          <div class="dd">
            <div class="mi" data-act="save">保存</div>
            <div class="mi" data-act="saveas">另存为</div>
            <div class="mi" data-act="copyScale" data-keep-menu="1" id="miCopyScale"
                 title="把当前色标导出成 JSON 文本并复制到剪贴板（内容与「另存为」的文件完全一样）">导出到剪贴板</div>
          </div>
        </div>
      </div>
      <div class="row"><label>色标名称</label><input type="text" id="scaleName" class="grow"></div>
      <div class="row"><label>单位</label>
        <select id="unitSelect" class="grow">
          <option value="°C">°C</option>
          <option value="°F">°F</option>
          <option value="K">K</option>
          <option value="亮度">亮度（Brightness）</option>
        </select>
      </div>
      <div class="row"><label id="rangeLabel">色标范围（°C）</label></div>
      <div class="row">
        <span class="muted" id="scaleRangeInfo">由最高温 / 最低温节点决定</span>
      </div>
      <div id="scaleBody">
        <div id="legendWrap"><canvas id="legendCanvas"></canvas></div>
        <div id="nodeColumn">
          <div class="pane-head"><div class="pane-title">色标节点</div></div>
          <div class="pane-rule"></div>
          <div class="row">
            <label><input type="checkbox" id="nodeSelectMode"> 选择</label>
            <span class="grow"></span>
            <button id="btnAddNode">添加节点</button>
          </div>
          <div class="row selbtns" id="nodeSelBtns">
            <button id="btnNodeAll">全选</button>
            <button id="btnNodeNone">全不选</button>
            <button class="btn-danger" id="btnNodeDelete">删除选中</button>
          </div>
          <div id="nodeList"></div>
        </div>
      </div>
    </section>

    <!-- 图片列表 -->
    <section id="imagePane">
      <div class="pane-head">
        <div class="pane-title">图片列表</div>
        <label><input type="checkbox" id="imgSelectMode"> 选择</label>
      </div>
      <div class="pane-rule"></div>
      <div class="row selbtns" id="imgSelBtns">
        <button id="btnImgAll">全选</button>
        <button id="btnImgNone">全不选</button>
        <button class="btn-danger" id="btnImgDelete">删除选中</button>
      </div>
      <div class="row">
        <div class="menu grow">
          <button type="button" class="dropbtn" id="btnExportMenu">导出图片<i class="caret"></i></button>
          <div class="dd dd-block">
            <div class="mi" data-act="exportOne">单张导出（当前预览）</div>
            <div class="mi" data-act="exportBatch">批量导出（已勾选的图片）</div>
          </div>
        </div>
      </div>
      <div id="imageList"></div>
      <button class="btn-primary" id="btnAddImages">添加图片</button>
    </section>
  </div>

  <div id="progressPanel" class="hidden">
    <div id="progressLabel"></div>
    <div id="progressOuter"><div id="progressInner"></div></div>
    <button id="btnCancelExport">取消</button>
  </div>

  <div id="logPane">
    <div class="pane-head">
      <div class="pane-title">运行日志</div>
      <button id="btnClearLog">清空日志</button>
    </div>
    <div id="logView"></div>
  </div>
</div>

<!-- 节点编辑对话框 -->
<dialog id="nodeDialog">
  <form method="dialog">
    <div class="dlg-body">
      <div class="field">
        <label id="nodeDlgPosLabel" for="nodeDlgPos">位置</label>
        <input type="text" id="nodeDlgPos">
        <div class="hint hidden" id="nodeDlgEndpointHint">保留节点：位置与颜色都可以修改，但不会被删除</div>
      </div>
      <div class="color-editor">
        <input type="color" id="nodeDlgPreview" class="color-preview"
               title="点击打开 Windows 原生颜色选择器">
        <div class="color-right">
          <button type="button" id="nodeDlgPick">选择颜色…</button>
          <div class="row"><label>HEX</label><input type="text" id="nodeDlgHex" class="hex-input" maxlength="7"></div>
          <div class="row">
            <label>R</label><input type="number" id="nodeDlgR" class="rgb-input" min="0" max="255" step="1">
            <label>G</label><input type="number" id="nodeDlgG" class="rgb-input" min="0" max="255" step="1">
            <label>B</label><input type="number" id="nodeDlgB" class="rgb-input" min="0" max="255" step="1">
          </div>
        </div>
      </div>
    </div>
    <div class="dlg-foot">
      <button value="ok" class="btn-primary" id="nodeDlgOk">确定</button>
      <button value="cancel" id="nodeDlgCancel">取消</button>
    </div>
  </form>
</dialog>

<!-- 通用提示对话框 -->
<dialog id="msgDialog">
  <form method="dialog">
    <div class="dlg-body">
      <div id="msgTitle" style="font-weight:600"></div>
      <div id="msgText" style="white-space:pre-wrap; max-width:560px; max-height:46vh; overflow:auto"></div>
    </div>
    <div class="dlg-foot"><button value="ok" class="btn-primary" id="msgOk">确定</button></div>
  </form>
</dialog>

<!-- 三选一对话框 -->
<dialog id="askDialog">
  <form method="dialog">
    <div class="dlg-body"><div id="askText"></div></div>
    <div class="dlg-foot">
      <button value="save" class="btn-primary" id="askSave">保存</button>
      <button value="discard" id="askDiscard">不保存</button>
      <button value="cancel" id="askCancel">取消</button>
    </div>
  </form>
</dialog>

<!-- 我的色标 / 管理色标（localStorage 里保存过的色标） -->
<dialog id="myScalesDialog">
  <div class="dlg-body">
    <div class="dlg-head">
      <div class="dlg-title" id="scaleLibTitle">我的色标</div>
      <div class="dlg-tools hidden" id="scaleLibTools">
        <label><input type="checkbox" id="scaleLibMulti"> 多选</label>
        <button type="button" id="scaleLibAll" class="hidden">全选</button>
        <button type="button" id="scaleLibNone" class="hidden">全不选</button>
        <button type="button" class="btn-danger" id="scaleLibDelete" disabled>删除</button>
      </div>
    </div>
    <div id="myScalesList" class="my-scales"></div>
  </div>
  <div class="dlg-foot dlg-foot-split">
    <button type="button" id="myScalesCancel">取消</button>
    <div class="dlg-tools">
      <button type="button" id="scaleLibCopy" disabled
              title="把选中的这条色标导出成 JSON 文本并复制到剪贴板（等同于「另存为」的内容）">导出到剪贴板</button>
      <button type="button" class="btn-primary" id="myScalesOk">确定</button>
    </div>
  </div>
</dialog>

<!-- 使用说明（帮助）：左侧分节目录 + 右侧渲染后的 Markdown 说明书 -->
<dialog id="helpDialog">
  <div class="dlg-body">
    <div class="dlg-head">

<script>
'use strict';
/* =========================================================================
 * 第 1 部分：核心常量与温度 / 单位换算（与界面无关）
 * ========================================================================= */

const T_C_DEFAULT_BLACK = 50.0;    // 默认：灰度 0（纯黑）对应的温度
const T_C_DEFAULT_WHITE = -85.0;   // 默认：灰度 255（纯白）对应的温度
const KELVIN_OFFSET = 273.15;
const DEF_K_BLACK = T_C_DEFAULT_BLACK + KELVIN_OFFSET;   // 323.15 K
const DEF_K_WHITE = T_C_DEFAULT_WHITE + KELVIN_OFFSET;   // 188.15 K
// 默认的上限 / 下限：由程序把黑色温度与白色温度**比较大小**得出（不要求用户按大小填）
const DEF_K_MAX = Math.max(DEF_K_BLACK, DEF_K_WHITE);
const DEF_K_MIN = Math.min(DEF_K_BLACK, DEF_K_WHITE);

// 图片温度：灰度值 -> 物理温度的唯一依据，与色标无关
// （切换色标不会改变像素代表多少度）
// 只有**两个端点温度**：p=0 是黑色温度，p=255 是白色温度；谁高谁低都行，
// 也就是「浅色代表高温」同样合法 —— 上限 / 下限由 setRange 比较大小后定出来。
let K_BLACK = DEF_K_BLACK;
let K_WHITE = DEF_K_WHITE;
let K_MAX = DEF_K_MAX;             // 上限 = max(黑色温度, 白色温度)
let K_MIN = DEF_K_MIN;             // 下限 = min(黑色温度, 白色温度)
let K_SPAN = K_MAX - K_MIN;

// 节点允许的温度边界（绝对零度以上，避免误输入天文数字）
const NODE_K_MIN = 1.0;
const NODE_K_MAX = 2000.0;

/** 设置图片温度：黑色端 / 白色端。上限与下限由程序比较大小后定出来。 */
function setRange(blackK, whiteK) {
  K_BLACK = Number(blackK);
  K_WHITE = Number(whiteK);
  K_MAX = Math.max(K_BLACK, K_WHITE);
  K_MIN = Math.min(K_BLACK, K_WHITE);
  K_SPAN = K_MAX - K_MIN;
}
const cBlack = () => K_BLACK - KELVIN_OFFSET;
const cWhite = () => K_WHITE - KELVIN_OFFSET;
const cMax = () => K_MAX - KELVIN_OFFSET;
const cMin = () => K_MIN - KELVIN_OFFSET;

/**
 * 图片温度校验：两个值都必须是数字，且都落在允许范围内。
 * **没有大小关系要求**：白色温度高于黑色温度（浅色代表高温）同样合法；
 * 两个端点温度相同时整幅图就是同一个温度，也允许。
 */
function validateImageRange(blackK, whiteK) {
  if (!isFinite(blackK) || !isFinite(whiteK)) return '黑色温度与白色温度都必须是数字。';
  for (const v of [blackK, whiteK]) {
    if (v < NODE_K_MIN || v > NODE_K_MAX) {
      return '两个温度都必须落在 ' + (NODE_K_MIN - KELVIN_OFFSET).toFixed(2) + '°C ~ '
        + (NODE_K_MAX - KELVIN_OFFSET).toFixed(2) + '°C 之间。';
    }
  }
  return null;
}

const UNIT_C = '°C', UNIT_F = '°F', UNIT_K = 'K', UNIT_B = '亮度';
const UNITS = [UNIT_C, UNIT_F, UNIT_K, UNIT_B];
const P_MAX = 255;

const DEFAULT_SCALE_NAME = '未命名色标';
const DEFAULT_HIGH_RGB = [0, 0, 0];          // 默认色标最高温节点 -> 黑色
const DEFAULT_LOW_RGB = [255, 255, 255];     // 默认色标最低温节点 -> 白色

/**
 * Legend 刻度（物理 °C 位置）。温度轴始终等于**图片温度**，
 * 默认每 10°C 一个刻度；范围很窄/很宽时自动换挡，刻度数量保持在 3 ~ 14 之间。
 * 图片两端的温度（黑色温度 / 白色温度，谁高都行）若正好落在整点上也会包含在内。
 */
function legendTicksC() {
  const lo = cMin(), hi = cMax();
  if (!(hi > lo)) return [hi];
  const steps = [1, 2, 5, 10, 20, 25, 50, 100, 200];
  const span = s => {
    const first = Math.ceil(lo / s - 1e-9);
    const last = Math.floor(hi / s + 1e-9);
    return { first: first, last: last, count: last - first + 1 };
  };
  let chosen = null;
  for (const s of steps) {
    const r = span(s);
    if (r.count >= 3 && r.count <= 14) { chosen = s; break; }
    if (chosen === null && r.count <= 14) chosen = s;
  }
  if (chosen === null) chosen = steps[steps.length - 1];
  const r = span(chosen);
  const out = [];
  for (let i = r.first; i <= r.last; i++) out.push(i * chosen);
  return out;
}

/**
 * Legend 上要标注的项：整点刻度 + 图片两端的温度（黑色端 / 白色端）。
 * 两端温度没落在刻度网格上时会额外补上，保证黑色和白色两端的温度始终标得出来。
 */
function legendEntries() {
  const lo = cMin(), hi = cMax();
  const ticks = legendTicksC();
  const onGrid = v => ticks.some(t => Math.abs(t - v) < 1e-9);
  const entries = ticks.map(c => ({
    c: c,
    isLimit: Math.abs(c - hi) < 1e-9 || Math.abs(c - lo) < 1e-9,
  }));
  if (!onGrid(hi)) entries.push({ c: hi, isLimit: true });
  if (!onGrid(lo)) entries.push({ c: lo, isLimit: true });
  entries.sort((a, b) => b.c - a.c);          // 高温在前（画的时候按各自位置定位）
  return entries;
}

const KEY_DIGITS = 2;

/** round-half-even（银行家舍入），按十进制字面值处理。 */
function roundHalfEven(value, digits = KEY_DIGITS) {
  if (!isFinite(value)) return value;
  const m = Math.pow(10, digits);
  const x = value * m;
  const f = Math.floor(x);
  const d = x - f;
  const EPS = 1e-9;
  let r;
  if (Math.abs(d - 0.5) < EPS) r = (Math.abs(f) % 2 === 0) ? f : f + 1;
  else r = Math.round(x);
  return r / m;
}

/**
 * 灰度值 0..255 -> Kelvin：p=0 是黑色温度，p=255 是白色温度（两者谁高都行）。
 * 两个端点温度相同时整幅图就是那一个温度。
 */
function pToKelvin(p) {
  if (K_SPAN < 1e-9) return K_BLACK;
  return K_BLACK + (K_WHITE - K_BLACK) * (p / P_MAX);
}
/** Kelvin -> 灰度位置 0..255（连续浮点）。端点温度相同时一律算作 0（黑色端）。 */
function kelvinToP(k) {
  if (K_SPAN < 1e-9) return 0;
  return (k - K_BLACK) * (P_MAX / (K_WHITE - K_BLACK));
}

function toDisplay(kelvin, unit) {
  switch (unit) {
    case UNIT_C: return kelvin - KELVIN_OFFSET;
    case UNIT_F: return (kelvin - KELVIN_OFFSET) * 9 / 5 + 32;
    case UNIT_K: return kelvin;
    case UNIT_B: return kelvinToP(kelvin);            // 黑色端 0，白色端 255
    default: throw new Error('未知单位：' + unit);
  }
}
function fromDisplay(value, unit) {
  switch (unit) {
    case UNIT_C: return value + KELVIN_OFFSET;
    case UNIT_F: return (value - 32) * 5 / 9 + KELVIN_OFFSET;
    case UNIT_K: return value;
    case UNIT_B: return pToKelvin(value);             // 0 -> 黑色端，255 -> 白色端
    default: throw new Error('未知单位：' + unit);
  }
}
function unitSuffix(unit) { return unit === UNIT_B ? '' : unit; }
function formatDisplay(kelvin, unit, digits = 2) {
  return toDisplay(kelvin, unit).toFixed(digits);
}
function parseFloatCN(text) {
  if (text === null || text === undefined) return null;
  let s = String(text).trim();
  if (!s) return null;
  s = s.replace(/[，。]/g, '.').replace(/,/g, '.').replace(/[＋]/g, '+').replace(/[－]/g, '-')
       .replace(/[°度]/g, '').replace(/[CFKc fk]/g, '').replace(/\s+/g, '');
  if (!/^[+-]?(\d+(\.\d*)?|\.\d+)$/.test(s)) return null;
  const v = Number(s);
  return isFinite(v) ? v : null;
}

function rgbToHex(rgb) {
  return '#' + rgb.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('').toUpperCase();
}
function parseColor(value) {
  if (Array.isArray(value)) {
    if (value.length < 3) throw new Error('颜色数组长度不足');
    const rgb = value.slice(0, 3).map(v => Math.round(Number(v)));
    if (rgb.some(v => !isFinite(v) || v < 0 || v > 255)) throw new Error('颜色分量超出 0..255');
    return rgb;
  }
  if (typeof value === 'string') {
    let s = value.trim();
    if (s.startsWith('#')) s = s.slice(1);
    if (s.includes(',')) return parseColor(s.split(',').slice(0, 3).map(Number));
    if (/^[0-9a-fA-F]{3}$/.test(s)) return [...s].map(ch => parseInt(ch + ch, 16));
    if (/^[0-9a-fA-F]{6}$/.test(s)) return [0, 2, 4].map(i => parseInt(s.substr(i, 2), 16));
  }
  throw new Error('非法颜色：' + JSON.stringify(value));
}

/* =========================================================================
 * 第 2 部分：色标模型 + 连续颜色映射
 * ========================================================================= */

let __uid = 0;
function nextUid() { return ++__uid; }

function makeNode(kelvin, rgb, pinned) {
  return { uid: nextUid(), kelvin: kelvin, rgb: rgb.slice(0, 3), pinned: !!pinned };
}
function positionKey(kelvin) { return roundHalfEven(kelvin); }
/** 保留节点：只禁止删除，位置与颜色都可以改 */
function isPinned(node) { return !!(node && node.pinned); }

/** 色标的显示范围 = 最高温节点 / 最低温节点 */
function scaleTempRange(nodes) {
  if (!nodes || !nodes.length) return { highK: K_MAX, lowK: K_MIN };
  let hi = -Infinity, lo = Infinity;
  for (const n of nodes) {
    if (n.kelvin > hi) hi = n.kelvin;
    if (n.kelvin < lo) lo = n.kelvin;
  }
  return { highK: hi, lowK: lo };
}

/** 新色标：一个强制保留的 50°C 黑色 + 一个普通的 -85°C 白色 */
function defaultScale() {
  return {
    name: DEFAULT_SCALE_NAME,
    created: Date.now(),        // 毫秒时间戳：色标身份，创建后不再改动
    nodes: [
      makeNode(DEF_K_MAX, DEFAULT_HIGH_RGB, true),
      makeNode(DEF_K_MIN, DEFAULT_LOW_RGB, false),
    ],
  };
}

/** 稳定排序：高温 -> 低温；重叠节点保持相对顺序，因此必然相邻。 */
function sortNodes(nodes) {
  nodes.sort((a, b) => b.kelvin - a.kelvin);
  return nodes;
}
function findNode(scale, uid) { return scale.nodes.find(n => n.uid === uid) || null; }
function indexOfNode(scale, uid) { return scale.nodes.findIndex(n => n.uid === uid); }
function countAt(scale, kelvin, excludeUid) {
  const key = positionKey(kelvin);
  return scale.nodes.filter(n => positionKey(n.kelvin) === key && n.uid !== excludeUid).length;
}
function nodeOverlaps(scale, node) {
  const i = indexOfNode(scale, node.uid);
  if (i < 0) return false;
  if (i > 0 && positionKey(scale.nodes[i - 1].kelvin) === positionKey(node.kelvin)) return true;
  if (i + 1 < scale.nodes.length && positionKey(scale.nodes[i + 1].kelvin) === positionKey(node.kelvin)) return true;
  return false;
}
function largestGapCenter(scale) {
  const r = scaleTempRange(scale.nodes);
  const ks = scale.nodes.map(n => n.kelvin);
  if (ks.length < 2) return r.highK;
  let best = (r.highK + r.lowK) / 2, bestLen = -1;
  for (let i = 0; i + 1 < ks.length; i++) {
    const len = ks[i] - ks[i + 1];
    if (len > bestLen) { bestLen = len; best = (ks[i] + ks[i + 1]) / 2; }
  }
  return best;
}
/** 返回错误文本；null 表示合法。 */
function validateNewPosition(scale, kelvin, excludeUid) {
  if (typeof kelvin !== 'number' || !isFinite(kelvin)) return '请输入合法的数字。';
  if (kelvin < NODE_K_MIN || kelvin > NODE_K_MAX) {
    return '节点温度必须在 ' + (NODE_K_MIN - KELVIN_OFFSET).toFixed(2) + '°C ~ '
      + (NODE_K_MAX - KELVIN_OFFSET).toFixed(2) + '°C 之间。';
  }
  if (countAt(scale, kelvin, excludeUid) >= 2) return '同一位置最多允许 2 个节点，该位置已有 2 个节点。';
  return null;
}

/** 连续颜色映射器：节点之间 RGB 三通道分别线性插值；重叠处形成硬跳变。 */
class ColorMapper {
  constructor(nodes) {
    const sorted = [...nodes].sort((a, b) => b.kelvin - a.kelvin);
    // 位置精度与配置文件一致（0.01 K）：这样「界面上的色标」和「保存后再打开的
    // 色标」颜色逐像素相同，不会因为 1e-3 K 级的浮点尾数而在同一位置出现硬跳变
    // 或极窄的过渡带（横向 / 竖向 legend 与图片着色因此永远一致）。
    this.k = sorted.map(n => roundHalfEven(n.kelvin));
    this.c = sorted.map(n => n.rgb.slice(0, 3));
    this._lut = null;
  }
  colorAtKelvin(t) {
    const k = this.k, c = this.c, n = k.length;
    if (n === 0) return [0, 0, 0];
    if (n === 1) return c[0].slice();
    // 与 Python searchsorted(side='right') 等价：m = k[j] >= t 的个数
    let m = 0;
    while (m < n && k[m] >= t) m++;
    // t 落在最冷节点上或更冷：一律取**最下方节点**的颜色（冷端拉伸）。
    // 若最冷的两个节点位置相同（硬跳变），原先会退化成取上面那个节点的颜色，
    // 与竖向 legend / 图片着色不一致。
    if (m >= n) return c[n - 1].slice();
    let i = m - 1;
    if (i < 0) i = 0;
    if (i > n - 2) i = n - 2;
    const k0 = k[i], k1 = k[i + 1];
    const den = k0 - k1;
    let f = den > 0 ? (k0 - t) / den : 0;
    if (f < 0) f = 0; else if (f > 1) f = 1;
    const c0 = c[i], c1 = c[i + 1];
    return [
      Math.round(c0[0] + (c1[0] - c0[0]) * f),
      Math.round(c0[1] + (c1[1] - c0[1]) * f),
      Math.round(c0[2] + (c1[2] - c0[2]) * f),
    ];
  }
  /** 按灰度值 0..255 建立查找表（图片着色用），与 Legend 使用同一算法。 */
  lut256() {
    if (!this._lut) {
      const lut = new Uint8Array(768);
      for (let p = 0; p < 256; p++) {
        const rgb = this.colorAtKelvin(pToKelvin(p));
        lut[p * 3] = rgb[0]; lut[p * 3 + 1] = rgb[1]; lut[p * 3 + 2] = rgb[2];
      }
      this._lut = lut;
    }
    return this._lut;
  }
}

/** 灰度 + Alpha -> RGBA（Alpha 原样复制）。 */
function colorize(gray, alpha, mapper, width, height) {
  const lut = mapper.lut256();
  const out = new Uint8ClampedArray(width * height * 4);
  for (let i = 0, n = width * height; i < n; i++) {
    const p = gray[i] * 3;
    const o = i * 4;
    out[o] = lut[p]; out[o + 1] = lut[p + 1]; out[o + 2] = lut[p + 2]; out[o + 3] = alpha[i];
  }
  return out;
}

/* =========================================================================
 * 第 3 部分：配置 JSON
 * ========================================================================= */

function scaleToObject(scale) {
  sortNodes(scale.nodes);
  return {
    // 毫秒时间戳：色标的唯一身份标识，创建后不再改动
    created: Number(scale.created) || 0,
    name: scale.name,
    nodes: scale.nodes.map(n => {
      const o = { temperature_k: roundHalfEven(n.kelvin), color: rgbToHex(n.rgb) };
      if (n.pinned) o.pinned = true;      // 保留节点（不可删除）
      return o;
    }),
  };
}
function scaleToText(scale) { return JSON.stringify(scaleToObject(scale), null, 2) + '\n'; }

class ConfigError extends Error {}

/**
 * 解析一份色标配置，只做校验与取值，不改动当前状态（列表渲染时要靠它）。
 * created 可选（旧文件没有就补当前时间）；旧文件里遗留的 range 字段直接忽略。
 */
function parseScaleRecord(data) {
  if (data === null || typeof data !== 'object' || Array.isArray(data)) throw new ConfigError('JSON 顶层必须是一个对象。');
  let name = data.name;
  if (typeof name !== 'string' || !name.trim()) name = DEFAULT_SCALE_NAME;

  let created = Number(data.created);
  if (!isFinite(created) || created <= 0) created = Date.now();

  const raw = data.nodes;
  if (!Array.isArray(raw) || raw.length < 1) {
    throw new ConfigError('缺少 nodes 字段，或一个节点都没有。');
  }
  const nodes = [];
  raw.forEach((item, i) => {
    if (item === null || typeof item !== 'object' || Array.isArray(item)) {
      throw new ConfigError('第 ' + (i + 1) + ' 个节点不是对象。');
    }
    const kRaw = (item.temperature_k !== undefined) ? item.temperature_k : item.kelvin;
    if (typeof kRaw !== 'number' || !isFinite(kRaw)) {
      throw new ConfigError('第 ' + (i + 1) + ' 个节点缺少合法的 temperature_k（Kelvin 数值）。');
    }
    if (kRaw < NODE_K_MIN || kRaw > NODE_K_MAX) {
      throw new ConfigError('第 ' + (i + 1) + ' 个节点温度 ' + kRaw + ' K 超出允许范围（'
        + NODE_K_MIN.toFixed(2) + ' K ~ ' + NODE_K_MAX.toFixed(2) + ' K）。');
    }
    if (item.color === undefined) throw new ConfigError('第 ' + (i + 1) + ' 个节点缺少 color 字段。');
    let rgb;
    try { rgb = parseColor(item.color); }
    catch (e) { throw new ConfigError('第 ' + (i + 1) + ' 个节点颜色非法：' + e.message); }
    nodes.push(makeNode(kRaw, rgb, item.pinned === true));
  });

  const record = { name: name, created: created, nodes: nodes };
  sortNodes(record.nodes);
  const keys = record.nodes.map(n => positionKey(n.kelvin));
  const seen = {};
  for (const k of keys) {
    seen[k] = (seen[k] || 0) + 1;
    if (seen[k] > 2) {
      throw new ConfigError('位置 ' + k.toFixed(2) + ' K 上有 ' + seen[k] + ' 个节点，同一位置最多允许 2 个。');
    }
  }
  return record;
}

/** 解析成可用的色标（色标不再携带温度范围，温度范围属于图片） */
function scaleFromObject(data) {
  const rec = parseScaleRecord(data);
  return { name: rec.name, created: rec.created, nodes: rec.nodes };
}

/* =========================================================================
 * 第 4 部分：色标库（localStorage）
 *
 * 「保存」写入这里，按 created 毫秒时间戳匹配：时间戳是色标的唯一身份，
 * 同名不同戳是两个色标，改名后再保存仍然是同一条记录。
 * ========================================================================= */

const SCALE_STORE_KEY = 'ir_enhancer.scales.v1';

/** 按 created 覆盖或插入（纯函数，便于自检） */
function upsertScaleRecord(list, record) {
  const out = (list || []).filter(r => r && Number(r.created) !== Number(record.created));
  out.push(record);
  out.sort((a, b) => Number(b.created) - Number(a.created));
  return out;
}

function sortScaleRecords(list) {
  return (list || []).slice().sort((a, b) => Number(b.created) - Number(a.created));
}

/** 把解析后的记录还原成可入库的标准对象 */
function recordToStorable(rec) {
  sortNodes(rec.nodes);
  return {
    created: Number(rec.created),
    name: rec.name,
    nodes: rec.nodes.map(n => {
      const o = { temperature_k: roundHalfEven(n.kelvin), color: rgbToHex(n.rgb) };
      if (n.pinned) o.pinned = true;
      return o;
    }),
  };
}

function formatCreatedTime(ms) {
  const d = new Date(Number(ms) || 0);
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate())
    + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

function storeAvailable() {
  try {
    const k = '__ir_probe__';
    localStorage.setItem(k, '1');
    localStorage.removeItem(k);
    return true;
  } catch (e) {
    return false;
  }
}

function readScaleStore() {
  try {
    const raw = localStorage.getItem(SCALE_STORE_KEY);
    if (!raw) return [];
    const data = JSON.parse(raw);
    return Array.isArray(data) ? data : [];
  } catch (e) {
    log('读取本地色标库失败：' + e.message);
    return [];
  }
}

function writeScaleStore(list) {
  try {
    localStorage.setItem(SCALE_STORE_KEY, JSON.stringify(list));
    return true;
  } catch (e) {
    log('写入本地色标库失败：' + e.message);
    return false;
  }
}

/* ---------------------------------------------------------------------
 * 「预设色标」= 配置文件驱动，数据**不内嵌在本文件里**
 *
 *   PreSet/manifest.js   清单：按顺序列出要载入的预置文件
 *   PreSet/<名字>.js     一条预置：一行包装 + 一段色标 JSON
 *                        (window.IR_PRESETS = window.IR_PRESETS || []).push({ ... })
 *
 * 为什么配置文件是 .js 而不是 .json：双击 index.html 时页面源是 file://，
 * 浏览器禁止 fetch / XMLHttpRequest 读本地文件（只放行 <script src> 载入的脚本），
 * 所以「配置」必须写成一段可执行的 JS —— 数据部分仍然是普通 JSON。
 * 增删 / 修改预置只改 PreSet/ 下的配置，不需要动 index.html。
 *
 * 预置里**没有** created 字段：created 是色标的身份，只在**导入的那一刻**按当前
 * 时间戳生成（见 presetToScale），所以每次导入都是一条全新的、可独立保存的色标。
 *
 * 清单缺失 / 某个文件载入失败 / 内容非法：跳过并在日志里写明原因与办法，
 * 预设列表就是空的 —— 不会退回任何硬编码数据。
 * ------------------------------------------------------------------- */

const PRESET_MANIFEST = 'PreSet/manifest.js';   // 清单文件（相对 index.html）
let PRESET_SCALES = [];                          // 运行时从配置载入；载入完成前为空
let presetLoadTask = null;                       // 载入 Promise：只跑一次

/** 用 <script> 标签载入一个配置文件（file:// 下唯一可行的「读本地文件」方式） */
function loadScriptTag(url) {
  return new Promise(resolve => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = () => resolve(true);
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
}

/**
 * 校验并规范化一条预置配置（就是配置文件里的那个对象）→ { name, nodes }。
 * 复用正式校验：温度范围 / 颜色写法 / 同一位置最多 2 个节点，不合法时抛 ConfigError。
 */
function presetFromConfig(raw) {
  const rec = parseScaleRecord(raw);
  return {
    name: rec.name,
    nodes: rec.nodes.map(n => {
      const o = { temperature_k: roundHalfEven(n.kelvin), color: rgbToHex(n.rgb) };
      if (n.pinned) o.pinned = true;
      return o;
    }),
  };
}

/** 载入清单里列出的全部预置文件（幂等；结果写进 PRESET_SCALES，返回同一个 Promise） */
function loadPresets() {
  if (presetLoadTask) return presetLoadTask;
  presetLoadTask = (async () => {
    window.IR_PRESETS = [];
    const manifestURL = new URL(PRESET_MANIFEST, document.baseURI);
    if (!await loadScriptTag(manifestURL.href)) {
      log('未找到预设配置 ' + PRESET_MANIFEST + '：预设列表为空。'
        + '把 PreSet 目录放在 index.html 旁边即可恢复；'
        + '也可以先用「管理色标 → 从设备导入」把色标 JSON 收进本地色标库。');
      return PRESET_SCALES;
    }
    const files = Array.isArray(window.IR_PRESET_FILES) ? window.IR_PRESET_FILES.slice() : [];
    if (!files.length) {
      log('预设清单 ' + PRESET_MANIFEST + ' 里没有列出任何文件：预设列表为空。');
      return PRESET_SCALES;
    }
    const loaded = [];
    const seen = new Set();
    for (const item of files) {
      const rel = String(item);
      let url;
      try { url = new URL(rel, manifestURL); }
      catch (e) { log('预设清单里的文件名不合法，已跳过：' + rel); continue; }
      if (seen.has(url.href)) { log('预设清单里重复列出了同一个文件，已跳过：' + rel); continue; }
      seen.add(url.href);
      const before = window.IR_PRESETS.length;
      if (!await loadScriptTag(url.href)) {
        log('预设文件载入失败，已跳过：' + rel + '（确认 PreSet 目录里有这个文件）');
        continue;
      }
      const added = window.IR_PRESETS.slice(before);
      if (!added.length) { log('预设文件没有提供色标数据，已跳过：' + rel); continue; }
      for (const raw of added) {
        try {
          const preset = presetFromConfig(raw);
          if (raw && raw.created !== undefined) {
            log('提示：' + rel + ' 里的 created 被忽略（预置的创建时间在导入那一刻才生成）。');
          }
          if (added.length === 1 && rel.replace(/\.js$/i, '') !== preset.name) {
            log('提示：' + rel + ' 里的 name 是「' + preset.name + '」，与文件名不一致。');
          }
          loaded.push(preset);
        } catch (e) {
          log('预设文件 ' + rel + ' 里的色标不能用，已跳过：' + e.message);
        }
      }
    }
    PRESET_SCALES = loaded;
    if (loaded.length) {
      log('已从配置文件载入 ' + loaded.length + ' 条预置色标：'
        + loaded.map(p => p.name).join(' / '));
    } else {
      log('没有载入任何预置色标：预设列表为空（原因见上面的日志）。');
    }
    return PRESET_SCALES;
  })();
  return presetLoadTask;
}

/** 需要预置数据的地方（「打开色标 → 预设」）先 await 它 */
const ensurePresetsLoaded = () => presetLoadTask || loadPresets();

/** 预置色标在弹窗里的内部行号（负数，不会与真实毫秒时间戳冲突） */
const PRESET_ROW_BASE = -1000;

/** 把预置色标包装成弹窗能用的记录（只为了列表渲染与单选，导入时不会用到这个 created） */
function presetRecords() {
  return PRESET_SCALES.map((p, i) => ({ created: PRESET_ROW_BASE - i, name: p.name, nodes: p.nodes }));
}

/** 按弹窗行号取回预置色标（导入时用它：行号与列表顺序严格对应，重名也不会选错） */
function presetByRow(created) {
  const index = PRESET_ROW_BASE - Number(created);
  return (index >= 0 && index < PRESET_SCALES.length) ? PRESET_SCALES[index] : null;
}

/** 按名字取一条预置色标（找不到返回 null） */
function presetByName(name) {
  return PRESET_SCALES.filter(p => p.name === name)[0] || null;
}

/**
 * 把预置色标变成可用的色标对象：**created 按调用时刻生成**
 * （预置文件里没有这个字段，导入后才算一条新色标，之后可以「保存」进本地库）。
 */
function presetToScale(preset, created) {
  return scaleFromObject({
    created: created === undefined ? Date.now() : created,
    name: preset.name,
    nodes: preset.nodes,
  });
}

/* =========================================================================
 * 第 4 部分：PNG 解码 / 编码（自行实现，保证灰度与 Alpha 逐字节精确）
 *
 * 说明：浏览器 canvas 的 getImageData 会在预乘 Alpha 往返中丢精度
 * （alpha<255 时灰度可能偏差 1~2 级，约等于 0.5~1°C），因此这里直接解析
 * PNG 数据流；解压/压缩使用浏览器内置的 DecompressionStream / CompressionStream。
 * ========================================================================= */

const PNG_SIG = [137, 80, 78, 71, 13, 10, 26, 10];

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function hasCompressionStream() {
  return typeof DecompressionStream === 'function' && typeof CompressionStream === 'function';
}

async function inflateBytes(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function deflateBytes(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

function concatBytes(list) {
  let total = 0;
  for (const b of list) total += b.length;
  const out = new Uint8Array(total);
  let off = 0;
  for (const b of list) { out.set(b, off); off += b.length; }
  return out;
}

function pngChunk(type, data) {
  const len = data.length;
  const out = new Uint8Array(12 + len);
  const dv = new DataView(out.buffer);
  dv.setUint32(0, len);
  for (let i = 0; i < 4; i++) out[4 + i] = type.charCodeAt(i);
  out.set(data, 8);
  const crcInput = new Uint8Array(4 + len);
  crcInput.set(out.subarray(4, 8 + len));
  dv.setUint32(8 + len, crc32(crcInput));
  return out;
}

/** PNG 行反滤波。 */
function pngUnfilter(raw, width, height, bpp, stride) {
  const out = new Uint8Array(height * stride);
  let pos = 0;
  for (let y = 0; y < height; y++) {
    if (pos >= raw.length) throw new Error('PNG 数据不完整。');
    const ft = raw[pos++];
    const rowOff = pos;
    pos += stride;
    const o = y * stride;
    for (let x = 0; x < stride; x++) {
      const a = x >= bpp ? out[o + x - bpp] : 0;
      const b = y > 0 ? out[o - stride + x] : 0;
      const c = (x >= bpp && y > 0) ? out[o - stride + x - bpp] : 0;
      let v = raw[rowOff + x];
      if (ft === 0) { /* None */ }
      else if (ft === 1) v = (v + a) & 255;
      else if (ft === 2) v = (v + b) & 255;
      else if (ft === 3) v = (v + ((a + b) >> 1)) & 255;
      else if (ft === 4) {
        const p = a + b - c;
        const pa = Math.abs(p - a), pb = Math.abs(p - b), pc = Math.abs(p - c);
        const pred = (pa <= pb && pa <= pc) ? a : (pb <= pc ? b : c);
        v = (v + pred) & 255;
      } else {
        throw new Error('不支持的 PNG 行滤波类型：' + ft);
      }
      out[o + x] = v;
    }
  }
  return out;
}

function scaleToByte(v, maxV) { return Math.round(v * 255 / maxV); }

/**
 * 解析 PNG，返回 { width, height, gray: Uint8Array, alpha: Uint8Array }。
 * 只支持非隔行扫描（隔行图片会抛错，由调用方回退到 canvas 解码）。
 */
async function decodePNG(buffer) {
  const b = new Uint8Array(buffer);
  if (b.length < 8) throw new Error('不是有效的 PNG 文件');
  for (let i = 0; i < 8; i++) if (b[i] !== PNG_SIG[i]) throw new Error('不是有效的 PNG 文件');

  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
  let off = 8, ihdr = null;
  const idat = [];
  let palette = null, trns = null;

  while (off + 8 <= b.length) {
    const len = dv.getUint32(off);
    const type = String.fromCharCode(b[off + 4], b[off + 5], b[off + 6], b[off + 7]);
    const data = b.subarray(off + 8, off + 8 + len);
    if (type === 'IHDR') {
      ihdr = {
        width: dv.getUint32(off + 8), height: dv.getUint32(off + 12),
        bitDepth: b[off + 16], colorType: b[off + 17],
        compression: b[off + 18], filter: b[off + 19], interlace: b[off + 20],
      };
    } else if (type === 'IDAT') idat.push(data);
    else if (type === 'PLTE') palette = data;
    else if (type === 'tRNS') trns = data;
    else if (type === 'IEND') break;
    off += 12 + len;
  }
  if (!ihdr) throw new Error('PNG 缺少 IHDR。');
  if (ihdr.interlace !== 0) throw new Error('暂不支持隔行扫描的 PNG。');
  if (ihdr.compression !== 0 || ihdr.filter !== 0) throw new Error('不支持的 PNG 压缩/滤波方式。');
  if (!idat.length) throw new Error('PNG 缺少图像数据。');

  const w = ihdr.width, h = ihdr.height, bd = ihdr.bitDepth, ct = ihdr.colorType;
  const CHANNELS = { 0: 1, 2: 3, 3: 1, 4: 2, 6: 4 };
  const ch = CHANNELS[ct];
  if (ch === undefined) throw new Error('不支持的 PNG 颜色类型：' + ct);
  if (![1, 2, 4, 8, 16].includes(bd)) throw new Error('不支持的 PNG 位深：' + bd);
  if (ct === 3 && !palette) throw new Error('调色板 PNG 缺少 PLTE。');

  const raw = await inflateBytes(concatBytes(idat));
  const bitsPerPixel = ch * bd;
  const stride = Math.ceil(w * bitsPerPixel / 8);
  const bpp = Math.max(1, Math.ceil(bitsPerPixel / 8));
  const px = pngUnfilter(raw, w, h, bpp, stride);

  const gray = new Uint8Array(w * h);
  const alpha = new Uint8Array(w * h);
  const maxV = (1 << bd) - 1;

  const sampleAt = (rowBase, index) => {
    if (bd === 8) return px[rowBase + index];
    if (bd === 16) return (px[rowBase + index * 2] << 8) | px[rowBase + index * 2 + 1];
    const bitPos = index * bd;
    const bytePos = rowBase + (bitPos >> 3);
    const shift = 8 - bd - (bitPos & 7);
    return (px[bytePos] >> shift) & maxV;
  };

  for (let y = 0; y < h; y++) {
    const rowBase = y * stride;
    for (let x = 0; x < w; x++) {
      const idx = y * w + x;
      let g = 0, a = 255;
      if (ct === 0) {
        g = scaleToByte(sampleAt(rowBase, x), maxV);
        a = 255;
      } else if (ct === 4) {
        g = scaleToByte(sampleAt(rowBase, x * 2), maxV);
        a = scaleToByte(sampleAt(rowBase, x * 2 + 1), maxV);
      } else if (ct === 2) {
        const r = scaleToByte(sampleAt(rowBase, x * 3), maxV);
        const gg = scaleToByte(sampleAt(rowBase, x * 3 + 1), maxV);
        const bb = scaleToByte(sampleAt(rowBase, x * 3 + 2), maxV);
        g = (r === gg && gg === bb) ? r : Math.round(0.299 * r + 0.587 * gg + 0.114 * bb);
        a = 255;
      } else if (ct === 6) {
        const r = scaleToByte(sampleAt(rowBase, x * 4), maxV);
        const gg = scaleToByte(sampleAt(rowBase, x * 4 + 1), maxV);
        const bb = scaleToByte(sampleAt(rowBase, x * 4 + 2), maxV);
        g = (r === gg && gg === bb) ? r : Math.round(0.299 * r + 0.587 * gg + 0.114 * bb);
        a = scaleToByte(sampleAt(rowBase, x * 4 + 3), maxV);
      } else { // ct === 3 调色板
        const pi = sampleAt(rowBase, x);
        g = palette[pi * 3];
        a = (trns && pi < trns.length) ? trns[pi] : 255;
        if (palette[pi * 3] !== palette[pi * 3 + 1] || palette[pi * 3 + 1] !== palette[pi * 3 + 2]) {
          g = Math.round(0.299 * palette[pi * 3] + 0.587 * palette[pi * 3 + 1] + 0.114 * palette[pi * 3 + 2]);
        }
      }
      gray[idx] = g;
      alpha[idx] = a;
    }
  }
  return { width: w, height: h, gray: gray, alpha: alpha };
}

/**
 * 用浏览器解码任意可解码的图片（JPG / JPEG，以及内置 PNG 解码失败时的兜底）。
 * 不透明像素（JPG 全是）经 canvas 往返是无损的，所以灰度值可以放心从这里取。
 */
async function decodePNGViaCanvas(file) {
  let bitmap;
  try {
    bitmap = await createImageBitmap(file, { premultiplyAlpha: 'none', colorSpaceConversion: 'none' });
  } catch (e) {
    bitmap = await createImageBitmap(file);
  }
  const bw = bitmap.width, bh = bitmap.height;    // close() 之后宽高会归零，先取出来
  if (!bw || !bh) {
    if (bitmap.close) bitmap.close();
    throw new Error('无法解码该图片（尺寸为 0）');
  }
  const cv = makeCanvas(bw, bh);
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.clearRect(0, 0, bw, bh);
  ctx.drawImage(bitmap, 0, 0);
  const d = ctx.getImageData(0, 0, bw, bh).data;
  const n = bw * bh;
  const gray = new Uint8Array(n), alpha = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2];
    gray[i] = (r === g && g === b) ? r : Math.round(0.299 * r + 0.587 * g + 0.114 * b);
    alpha[i] = d[i * 4 + 3];
  }
  if (bitmap.close) bitmap.close();
  return { width: bw, height: bh, gray: gray, alpha: alpha };
}

/** RGBA -> PNG 字节流（8 位 RGBA，保留 Alpha）。 */
async function encodePNG(rgba, width, height) {
  const stride = width * 4;
  const rawData = new Uint8Array((stride + 1) * height);
  for (let y = 0; y < height; y++) {
    const o = y * (stride + 1);
    rawData[o] = 0;                                    // filter: None
    rawData.set(rgba.subarray(y * stride, (y + 1) * stride), o + 1);
  }
  const idat = hasCompressionStream() ? await deflateBytes(rawData) : rawData;
  const ihdr = new Uint8Array(13);
  const dv = new DataView(ihdr.buffer);
  dv.setUint32(0, width);
  dv.setUint32(4, height);
  ihdr[8] = 8;    // bit depth
  ihdr[9] = 6;    // color type: RGBA
  ihdr[10] = 0; ihdr[11] = 0; ihdr[12] = 0;
  return concatBytes([
    new Uint8Array(PNG_SIG),
    pngChunk('IHDR', ihdr),
    pngChunk('IDAT', idat),
    pngChunk('IEND', new Uint8Array(0)),
  ]);
}

/* =========================================================================
 * 第 5 部分：ZIP 打包（批量导出在无目录写入权限时的回退方案）
 * ========================================================================= */

function zipStore(files) {
  const enc = new TextEncoder();
  const locals = [], centrals = [];
  let offset = 0;
  const now = new Date();
  const dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
  const dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;

  for (const f of files) {
    const nameBytes = enc.encode(f.name);
    const crc = crc32(f.data);
    const local = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);         // version needed
    lv.setUint16(6, 0x0800, true);     // UTF-8 文件名
    lv.setUint16(8, 0, true);          // store
    lv.setUint16(10, dosTime, true);
    lv.setUint16(12, dosDate, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, f.data.length, true);
    lv.setUint32(22, f.data.length, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);
    local.set(nameBytes, 30);
    locals.push(local, f.data);

    const central = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(central.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, dosTime, true);
    cv.setUint16(14, dosDate, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, f.data.length, true);
    cv.setUint32(24, f.data.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint32(42, offset, true);
    central.set(nameBytes, 46);
    centrals.push(central);

    offset += local.length + f.data.length;
  }

  const centralSize = centrals.reduce((s, c) => s + c.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, offset, true);

  return new Blob([...locals, ...centrals, eocd], { type: 'application/zip' });
}

/* =========================================================================
 * 第 6 部分：文件读写助手（优先使用原生「另存为 / 选择文件夹」接口）
 * ========================================================================= */

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

async function readFileText(file) {
  return await file.text();
}

async function writeTextToHandle(handle, text) {
  const w = await handle.createWritable();
  await w.write(text);
  await w.close();
}

function log(message) {
  const view = $('logView');
  const now = new Date();
  const p = n => String(n).padStart(2, '0');
  const stamp = p(now.getHours()) + ':' + p(now.getMinutes()) + ':' + p(now.getSeconds());
  const line = document.createElement('div');
  line.textContent = '[' + stamp + '] ' + message;
  view.appendChild(line);
  while (view.childElementCount > 3000) view.removeChild(view.firstChild);
  view.scrollTop = view.scrollHeight;
}

function showMessage(title, text, isError) {
  return new Promise(resolve => {
    const dlg = $('msgDialog');
    $('msgTitle').textContent = title;
    $('msgTitle').style.color = isError ? cssVar('--danger', '#b10e1c') : cssVar('--text-1', '#24292e');
    $('msgText').textContent = text;
    const close = () => { dlg.removeEventListener('close', close); resolve(); };
    dlg.addEventListener('close', close);
    dlg.showModal();
  });
}
const showError = (title, text) => showMessage(title, text, true);

/** 保存 / 不保存 / 取消 */
function askSaveThreeWay(text) {

    dlg.addEventListener('close', close);

}

/** 两个按钮的确认框 */
function askConfirm(text, okLabel, cancelLabel) {

    const dlg = $('askDialog');
    $('askText').textContent = text;
    $('askSave').textContent = okLabel || '确定';

    dlg.addEventListener('close', close);

}

/** 单行文本输入框 */
function askText(title, label, defaultValue) {
  return new Promise(resolve => {
    const dlg = $('inputDialog');
    const inp = $('inputValue');
    $('inputLabel').textContent = label;
    inp.value = defaultValue;
    dlg.returnValue = 'cancel';
    dlg.addEventListener('close', function onClose() {
      dlg.removeEventListener('close', onClose);
      inp.removeEventListener('keydown', onKey);
      resolve(dlg.returnValue === 'ok' ? inp.value : null);
    });
    function onKey(e) {
      if (e.key === 'Enter') { e.preventDefault(); $('inputOk').click(); }

    dlg.showModal();
    inp.focus();
    inp.select();
