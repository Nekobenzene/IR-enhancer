/* =========================================================================
 * 第 20 部分：使用说明（帮助）—— 内置 Markdown 说明书 + 极简渲染器
 *
 * 说明书正文写在页面底部那段 type=text/markdown 的脚本块里
 * （不执行、不显示），打开帮助时现场渲染成 HTML，左侧自动生成分节目录。
 * ========================================================================= */

function escapeHtmlText(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/** 行内语法：`代码`、**粗体**、[文字](链接) */
function renderInlineMarkdown(s) {
  const codes = [];
  let out = escapeHtmlText(s).replace(/`([^`]+)`/g, (m, p1) => {
    codes.push(p1);
    return '\u0000' + (codes.length - 1) + '\u0000';
  });
  out = out.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
    (m, text, href) => '<a href="' + href + '" target="_blank" rel="noreferrer">' + text + '</a>');
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/\u0000(\d+)\u0000/g, (m, n) => '<code>' + codes[Number(n)] + '</code>');
  return out;
}

/**
 * 极简 Markdown 渲染器，只覆盖说明书用到的语法：
 * 标题（#~####）/ 段落 / 有序与无序列表（含一层缩进）/ 表格 / 代码块 / 引用 / 分隔线。
 * 返回 { html, toc }，toc 里是二级、三级标题，供左侧目录使用。
 */
function renderMarkdown(md) {
  const CJK = /[\u2e80-\u9fff\uf900-\ufaff\uff00-\uffef]/;
  const joinLines = ls => ls.reduce((a, b) => {
    if (!a) return b;
    return (CJK.test(a.slice(-1)) || CJK.test(b.charAt(0))) ? a + b : a + ' ' + b;
  }, '');
  const lines = String(md).replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  const toc = [];
  const para = [];
  const flush = () => {
    if (para.length) { out.push('<p>' + renderInlineMarkdown(joinLines(para)) + '</p>'); para.length = 0; }
  };
  let sec = 0;
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];

    // 代码块
    if (/^\s*```/.test(line)) {
      flush();
      i++;
      const body = [];
      while (i < lines.length && !/^\s*```/.test(lines[i])) { body.push(lines[i]); i++; }
      i++;
      out.push('<pre><code>' + escapeHtmlText(body.join('\n')) + '</code></pre>');
      continue;
    }

    // 标题
    const h = /^(#{1,6})\s+(.*)$/.exec(line);
    if (h) {
      flush();
      const level = h[1].length;
      const raw = h[2].trim();
      if (level === 1) {
        out.push('<h1>' + renderInlineMarkdown(raw) + '</h1>');
      } else {
        sec++;
        const id = 'help-sec-' + sec;
        // 目录只列「章」（二级标题），小节挂在所属章下面；三级标题仍带锚点
        if (level === 2) {
          toc.push({ id: id, level: level, text: raw, children: [] });
        } else if (level === 3 && toc.length) {
          toc[toc.length - 1].children.push({ id: id, level: level, text: raw });
        }
        out.push('<h' + level + ' id="' + id + '">' + renderInlineMarkdown(raw) + '</h' + level + '>');
      }
      i++;
      continue;
    }

    // 分隔线
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flush(); out.push('<hr>'); i++; continue; }

    // 引用
    if (/^\s*>/.test(line)) {
      flush();
      const body = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        body.push(lines[i].replace(/^\s*>\s?/, ''));
        i++;
      }
      out.push('<blockquote><p>' + renderInlineMarkdown(joinLines(body)) + '</p></blockquote>');
      continue;
    }

    // 表格：本行有 |，下一行是 |---|---| 形式的分隔行
    if (line.indexOf('|') >= 0 && i + 1 < lines.length
        && /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(lines[i + 1])) {
      flush();
      const cut = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(s => s.trim());
      const head = cut(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].indexOf('|') >= 0 && lines[i].trim()) {
        rows.push(cut(lines[i]));
        i++;
      }
      out.push('<table><thead><tr>' + head.map(c => '<th>' + renderInlineMarkdown(c) + '</th>').join('')
        + '</tr></thead><tbody>'
        + rows.map(r => '<tr>' + r.map(c => '<td>' + renderInlineMarkdown(c) + '</td>').join('') + '</tr>').join('')
        + '</tbody></table>');
      continue;
    }

    // 列表（-、*、+ 或 1. ；缩进 2 空格算一层嵌套）
    if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
      flush();
      let html = '';
      const tags = [];
      const liOpen = [false, false];         // 每一层是否有没闭合的 <li>
      const closeLiAt = lv => { if (liOpen[lv]) { html += '</li>'; liOpen[lv] = false; } };
      const closeList = () => {
        const lv = tags.length - 1;
        closeLiAt(lv);
        if (tags.length) html += '</' + tags.pop() + '>';
      };
      while (i < lines.length) {
        const m = /^(\s*)([-*+]|\d+\.)\s+(.*)$/.exec(lines[i]);
        if (!m) break;
        const nestedItem = tags.length > 0 && m[1].replace(/\t/g, '  ').length >= 2;
        const t = /\d/.test(m[2]) ? 'ol' : 'ul';
        if (!nestedItem) {
          while (tags.length > 1) closeList();
          if (!tags.length) { tags.push(t); html += '<' + t + '>'; }
          closeLiAt(0);
          html += '<li>' + renderInlineMarkdown(m[3].trim());
          liOpen[0] = true;
        } else {
          if (tags.length < 2) { tags.push(t); html += '<' + t + '>'; }
          else if (tags[1] !== t) { closeList(); tags.push(t); html += '<' + t + '>'; }
          closeLiAt(1);
          html += '<li>' + renderInlineMarkdown(m[3].trim());
          liOpen[1] = true;
        }
        i++;
      }
      while (tags.length) closeList();
      out.push(html);
      continue;
    }

    // 空行 = 段落结束
    if (!line.trim()) { flush(); i++; continue; }

    para.push(line.trim());
    i++;
  }
  flush();
  return { html: out.join('\n'), toc: toc };
}

/** 说明书的 Markdown 源（页面里那段不执行的 script） */
function helpMarkdownSource() {
  const el = $('helpMarkdown');
  return el ? el.textContent.replace(/^\s*\n/, '').replace(/\s+$/, '') : '';
}

let helpRendered = false;
let helpExpanded = null;     // 当前展开小节的章 id（默认都收起）
let helpPin = null;          // 刚点过的目录项：滚动到位期间保持它高亮
let helpPinUntil = 0;

function helpScrollTo(id) {
  const doc = $('helpDoc');
  const el = doc.querySelector('#' + id);
  if (!el) return;
  const delta = el.getBoundingClientRect().top - doc.getBoundingClientRect().top;
  doc.scrollTop = Math.max(0, doc.scrollTop + delta - 8);
  helpPin = id;
  helpPinUntil = Date.now() + 500;   // 最后一节可能滚不到顶，期间不让高亮被改回去
  markActiveHelpSection();
}

function markActiveHelpSection() {
  const doc = $('helpDoc');
  const buttons = $('helpNav').querySelectorAll('button');
  if (!buttons.length) return;
  if (helpPin && Date.now() < helpPinUntil) {
    Array.prototype.forEach.call(buttons, b => {
      b.classList.toggle('active', b.dataset.target === helpPin);
    });
    return;
  }
  helpPin = null;
  const base = doc.getBoundingClientRect().top;
  let active = buttons[0].dataset.target;
  Array.prototype.forEach.call(buttons, b => {
    const el = doc.querySelector('#' + b.dataset.target);
    if (el && el.getBoundingClientRect().top - base <= 16) active = b.dataset.target;
  });
  Array.prototype.forEach.call(buttons, b => {
    b.classList.toggle('active', b.dataset.target === active);
  });
}

/** 展开某一章的小节（再点一次收起）；同时只展开一章 */
function setHelpExpanded(id) {
  helpExpanded = (helpExpanded === id) ? null : id;
  Array.prototype.forEach.call($('helpNav').querySelectorAll('.hn-group'), g => {
    const on = g.dataset.target === helpExpanded;
    g.classList.toggle('open', on);
    const caret = g.querySelector('.hn-caret');
    if (caret && caret.textContent) caret.textContent = on ? '▾' : '▸';
  });
}

/** 打开「帮助 → 使用说明」：左侧分节目录 + 右侧渲染后的说明书 */
function showHelp() {
  const dlg = $('helpDialog');
  if (!helpRendered) {
    const r = renderMarkdown(helpMarkdownSource());
    $('helpDoc').innerHTML = r.html;
    const nav = $('helpNav');
    nav.innerHTML = '';
    r.toc.forEach(ch => {
      const group = document.createElement('div');
      group.className = 'hn-group';
      group.dataset.target = ch.id;

      const top = document.createElement('button');
      top.type = 'button';
      top.className = 'hn-top';
      top.dataset.target = ch.id;
      top.title = ch.text;
      const caret = document.createElement('span');
      caret.className = 'hn-caret';
      caret.textContent = ch.children.length ? '▸' : '';     // 有小节才显示折叠箭头
      const label = document.createElement('span');
      label.className = 'hn-label';
      label.textContent = ch.text;
      top.appendChild(caret);
      top.appendChild(label);
      top.addEventListener('click', () => {
        helpScrollTo(ch.id);
        if (ch.children.length) setHelpExpanded(ch.id);
        else helpExpanded = null;
      });
      group.appendChild(top);

      ch.children.forEach(sub => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'hn-sub';
        b.dataset.target = sub.id;
        b.title = sub.text;
        b.textContent = sub.text;
        b.addEventListener('click', () => helpScrollTo(sub.id));
        group.appendChild(b);
      });
      nav.appendChild(group);
    });
    $('helpDoc').addEventListener('scroll', markActiveHelpSection);
    $('helpClose').addEventListener('click', () => dlg.close());
    helpRendered = true;
  }
  $('helpDoc').scrollTop = 0;
  if (!dlg.open) dlg.showModal();
  markActiveHelpSection();
}

function handleAction(act) {
  switch (act) {
    case 'presets': actionPresets(); break;
    case 'myScales': actionMyScales(); break;
    case 'manageScales': actionManageScales(); break;
    case 'importToStore': actionImportToStore(); break;
    case 'open': actionOpen(); break;
    case 'inputScale': actionInputScale(); break;
    case 'save': actionSave(); break;
    case 'saveas': actionSaveAs(); break;
    case 'copyScale': actionCopyScale(); break;
    case 'exportOne': actionExportCurrent(); break;
    case 'exportBatch': actionExportBatch(); break;
    case 'quit': actionQuit(); break;
    case 'help': showHelp(); break;          // 菜单栏「帮助」= 直接打开使用说明
  }
}

/* =========================================================================
 * 第 21 部分：事件绑定与初始化
 * ========================================================================= */

function closeAllMenus() {
  document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open'));
  resetCopyScaleLabel();     // 菜单一关，「导出到剪贴板」立刻切回原文案
}

function bindUI() {
  // 菜单栏 + 面板下拉按钮组
  document.querySelectorAll('.menu').forEach(menu => {
    const title = menu.querySelector('.mt') || menu.querySelector('.dropbtn');
    if (!title) return;
    title.addEventListener('click', e => {
      e.stopPropagation();
      if (title.disabled) return;
      const wasOpen = menu.classList.contains('open');
      closeAllMenus();
      if (!wasOpen) menu.classList.add('open');
    });
    title.addEventListener('mouseenter', () => {
      if (document.querySelector('.menu.open')) { closeAllMenus(); menu.classList.add('open'); }
    });
  });
  document.addEventListener('click', closeAllMenus);
  document.querySelectorAll('[data-act]').forEach(el => {
    el.addEventListener('click', e => {
      const act = el.dataset.act;
      const keepMenu = el.dataset.keepMenu === '1';
      const menu = el.closest('.menu');
      const disabled = el.classList.contains('disabled') || el.disabled;
      // 「导出到剪贴板」要留出「已复制」反馈的时间，所以它点完不收起菜单
      if (keepMenu) e.stopPropagation();
      closeAllMenus();
      if (keepMenu && menu && !disabled) menu.classList.add('open');
      if (disabled) return;
      handleAction(act);
    });
  });

  // 色标名称
  const nameInput = $('scaleName');
  const commitName = () => {
    const text = nameInput.value;
    if (!text.trim()) {
      log('色标名称不能为空或全空白，已恢复为之前的名称。');
      nameInput.value = state.scale.name;
      return;
    }
    if (text !== state.scale.name) {
      state.scale.name = text.trim();
      nameInput.value = state.scale.name;
      updateTitle();
    }
  };
  nameInput.addEventListener('blur', commitName);
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); nameInput.blur(); } });

  // 单位
  $('unitSelect').addEventListener('change', e => {
    state.unit = e.target.value;
    updateRangeInputs();
    drawLegend();
    renderNodeCards();
    log('显示单位切换为：' + state.unit);
  });

  // 图片温度：黑色端 / 白色端（只填数字，单位取当前全局单位；不要求谁大谁小）
  ['imageRangeBlack', 'imageRangeWhite'].forEach(id => {
    const el = $(id);
    el.addEventListener('blur', commitRange);
    el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
  });

  // 节点选择模式
  $('nodeSelectMode').addEventListener('change', e => {
    state.nodeSelMode = e.target.checked;
    if (!state.nodeSelMode) state.nodeChecked.clear();   // 退出选择状态：清除所有勾选
    updateSelectionButtons();
    renderNodeCards();
  });
  $('btnAddNode').addEventListener('click', addNode);
  $('btnNodeAll').addEventListener('click', () => {
    state.nodeChecked = new Set(state.scale.nodes.filter(n => !isPinned(n)).map(n => n.uid));
    renderNodeCards();
  });
  $('btnNodeNone').addEventListener('click', () => { state.nodeChecked.clear(); renderNodeCards(); });
  $('btnNodeDelete').addEventListener('click', deleteCheckedNodes);

  // 图片选择模式
  $('imgSelectMode').addEventListener('change', e => {
    state.imgSelMode = e.target.checked;
    if (!state.imgSelMode) state.entries.forEach(x => { x.checked = false; });
    updateSelectionButtons();
    renderImageList();
  });
  $('btnImgAll').addEventListener('click', () => { state.entries.forEach(x => { x.checked = true; }); renderImageList(); });
  $('btnImgNone').addEventListener('click', () => { state.entries.forEach(x => { x.checked = false; }); renderImageList(); });
  $('btnImgDelete').addEventListener('click', deleteSelectedImages);
  $('btnAddImages').addEventListener('click', () => { if (!state.busy) $('fileImages').click(); });
  $('fileImages').addEventListener('change', async e => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    if (files.length) await addImages(files);
  });

  // 日志
  $('btnClearLog').addEventListener('click', () => { $('logView').innerHTML = ''; });

  // 预览：重置视图 / 滚轮缩放 / 拖动平移 / 触屏捏合缩放 + 双击放大复原
  $('btnResetView').addEventListener('click', resetPreviewView);
  const cv = $('previewCanvas');
  const clampScale = s => Math.max(0.02, Math.min(s, 64));
  /** 以画布坐标 (px, py) 为锚点缩放到 ns：锚点下的像素保持不动 */
  function zoomAt(px, py, ns) {
    const p = state.preview;
    ns = clampScale(ns);
    if (Math.abs(ns - p.scale) < 1e-9) return;
    const ix = (px - p.ox) / p.scale, iy = (py - p.oy) / p.scale;
    p.scale = ns;
    p.ox = px - ix * ns;
    p.oy = py - iy * ns;
    p.fit = false;
    drawPreview();
  }
  const fitScale = () => {
    const img = state.offscreen;
    if (!img) return 1;
    return Math.min(cv.clientWidth / img.width, cv.clientHeight / img.height);
  };
  cv.addEventListener('wheel', e => {
    if (!state.offscreen || state.busy) return;
    e.preventDefault();
    const rect = cv.getBoundingClientRect();
    zoomAt(e.clientX - rect.left, e.clientY - rect.top,
      state.preview.scale * Math.pow(1.25, -e.deltaY / 120));
  }, { passive: false });

  const pointers = new Map();        // 正在按下的触点：pointerId -> {x, y}（屏幕坐标）
  let pinch = null;                  // 双指捏合的起始基准
  let lastTap = { t: 0, x: 0, y: 0 };   // 触屏双击判定
  const canvasXY = (clientX, clientY) => {
    const r = cv.getBoundingClientRect();
    return { x: clientX - r.left, y: clientY - r.top };
  };
  /** 记录双指捏合基准：中点对应的图像坐标 + 当前缩放 */
  function pinchStart() {
    const pts = [...pointers.values()];
    const a = pts[0], b = pts[1];
    const mid = canvasXY((a.x + b.x) / 2, (a.y + b.y) / 2);
    const p = state.preview;
    return {
      dist: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)),
      scale: p.scale,
      ix: (mid.x - p.ox) / p.scale,
      iy: (mid.y - p.oy) / p.scale,
    };
  }
  function beginPan(x, y) {
    state.panning = true;
    state.panStart = { x, y };
    state.panOrigin = { x: state.preview.ox, y: state.preview.oy };
    cv.style.cursor = 'grabbing';
  }
  cv.addEventListener('pointerdown', e => {
    if (!state.offscreen || state.busy) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    // 触屏双击：Fit <-> 放大 2.5 倍（鼠标仍用滚轮，行为不变）
    if (e.pointerType !== 'mouse' && pointers.size === 0) {
      const now = Date.now();
      const near = Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 28;
      if (now - lastTap.t < 320 && near) {
        lastTap.t = 0;
        if (state.preview.fit) {
          const xy = canvasXY(e.clientX, e.clientY);
          zoomAt(xy.x, xy.y, fitScale() * 2.5);
        } else {
          resetPreviewView();
        }
        return;
      }
      lastTap = { t: now, x: e.clientX, y: e.clientY };
    }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 合成事件没有真实指针 */ }
    if (pointers.size === 1) {
      // 触屏在 Fit 状态下不拖动（纵向留给页面滚动）；鼠标行为与桌面版一致
      if (!state.preview.fit || e.pointerType === 'mouse') beginPan(e.clientX, e.clientY);
    } else if (pointers.size === 2) { state.panning = false; pinch = pinchStart(); }
  });
  cv.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pointers.size >= 2) {
      const pts = [...pointers.values()];
      const a = pts[0], b = pts[1];
      const mid = canvasXY((a.x + b.x) / 2, (a.y + b.y) / 2);
      const dist = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y));
      const p = state.preview;
      p.scale = clampScale(pinch.scale * dist / pinch.dist);
      p.ox = mid.x - pinch.ix * p.scale;
      p.oy = mid.y - pinch.iy * p.scale;
      p.fit = false;
      drawPreview();
      return;
    }
    if (!state.panning) return;
    state.preview.ox = state.panOrigin.x + (e.clientX - state.panStart.x);
    state.preview.oy = state.panOrigin.y + (e.clientY - state.panStart.y);
    state.preview.fit = false;
    drawPreview();
  });
  const endPan = e => {
    pointers.delete(e.pointerId);
    try { cv.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    if (pointers.size >= 2) { pinch = pinchStart(); return; }   // 还按着两根：重取基准
    pinch = null;
    if (pointers.size === 1 && !state.preview.fit) {            // 松开一根：剩下那根继续平移
      const only = [...pointers.values()][0];
      beginPan(only.x, only.y);
      return;
    }
    if (!state.panning) { cv.style.cursor = ''; return; }
    state.panning = false;
    cv.style.cursor = '';
  };
  cv.addEventListener('pointerup', endPan);
  cv.addEventListener('pointercancel', endPan);
  // 失焦 / 指针被系统收走时，别把「正在平移」的状态留下
  window.addEventListener('blur', () => {
    pointers.clear(); pinch = null;
    if (state.panning) { state.panning = false; cv.style.cursor = ''; }
  });

  // 批量导出取消
  $('btnCancelExport').addEventListener('click', () => {
    if (state.busy) {
      state.batchCancel = true;
      $('btnCancelExport').disabled = true;
      $('progressLabel').textContent = '正在取消，等待当前文件处理完成…';
      log('用户取消了批量导出。');
    }
  });

  // 尺寸变化：合并到下一帧执行，避免在 ResizeObserver 回调里同步改布局
  let resizePending = false;
  const onResize = () => {
    if (resizePending) return;
    resizePending = true;
    requestAnimationFrame(() => {
      resizePending = false;
      if (state.preview.fit) applyFit();
      drawPreview();
      drawLegend();
    });
  };
  window.addEventListener('resize', onResize);
  if (typeof ResizeObserver === 'function') {
    const ro = new ResizeObserver(onResize);
    ro.observe($('previewWrap'));
    ro.observe($('legendWrap'));
  }

  // 退出前提醒
  window.addEventListener('beforeunload', e => {
    if (state.busy || isDirty()) { e.preventDefault(); e.returnValue = ''; return ''; }
  });

  // 不支持拖拽导入：阻止把图片拖到页面上（否则浏览器会直接打开该文件）
  ['dragover', 'drop'].forEach(evt => {
    window.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }, false);
  });
}

function init() {
  nodeColorEditor = new ColorEditor('nodeDlgPreview', 'nodeDlgHex', 'nodeDlgR', 'nodeDlgG', 'nodeDlgB',
                                    'nodeDlgPick');
  bindUI();
  state.mapper = new ColorMapper(state.scale.nodes);
  state.baseline = scaleToText(state.scale);
  $('unitSelect').value = state.unit;
  refreshAll();
  updateActionStates();

  log('程序已启动。默认色标：50°C 黑色 → -85°C 白色。');
  log('温度映射：T = 50 - 135 × p / 255。');
  loadPresets();     // 预设来自 PreSet/ 下的配置文件：异步载入，结果写进日志
  if (!hasCompressionStream()) {

    log('提示：当前浏览器不支持原生「另存为 / 选择文件夹」，将改用下载方式保存。建议使用 Edge 或 Chrome。');
  }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

<script type="text/markdown" id="helpMarkdown">
# 红外灰度色标增强工具 · 使用说明

> **单文件、离线、零安装**：双击 `index.html`，用 Edge 或 Chrome 打开即可（在文件上右键 →「打开方式」→ Edge / Chrome）。所有处理都在本机完成，图片不会上传，也不需要联网。

本文共 12 章，左侧目录点一下就能跳过去；带 ▸ 的章节点开后会展开小节。

## 1. 上手

### 1.1 这个工具做什么

把红外灰度图（**PNG / JPG**）按「灰度值 → 物理温度 → 颜色」的固定映射重新着色成彩色图，并导出为**与源文件同格式、同分辨率**的图片。

- **灰度 → 温度**：`T = 黑色温度 + (白色温度 - 黑色温度) × p / 255`，`p` 是 0~255 的灰度值（0 = 纯黑、255 = 纯白），**黑色温度 / 白色温度**在预览区顶部设定。
- **温度 → 颜色**：由色标决定。色标是一串「温度 + 颜色」节点，节点之间 RGB 三通道分别线性插值；两个节点温度相同时形成硬跳变。
- **温度属于图片，不属于色标**：切换色标只换配色方案，不改变「某个灰度代表多少度」。
- **上限 / 下限由程序自己比较得出**：填的两个温度谁高谁低都行，所以**浅色代表高温**（白色温度更高）也支持；
  上限 = 两者中较大的、下限 = 较小的，程序用它们来做刻度、亮度换算与范围判断。

### 1.2 快速开始（三步）

1. 点右上角 **「添加图片」**，选一张或多张 PNG / JPG（可多选；不支持拖拽）。
2. 看一眼预览区顶部的 **温度（°C）** 里「黑色温度 / 白色温度」（默认 50 / -85），需要就改；再点 **打开色标 → 预设** 挑一套现成色标（配置文件里现成的 9 套，含标准 BD 色阶；想从零搭就选「空白」）。
3. 点 **导出图片 → 单张导出**（导出当前预览的那张）或 **批量导出**（先勾选要导出的图片）。

### 1.3 界面总览

| 区域 | 内容 |
| --- | --- |
| 顶部菜单栏 | 左：帮助（使用说明 / 关于）；右：退出 |
| 左侧大区 | 图片预览；标题栏含「黑色温度 / 白色温度」两个输入框和「重置视图」按钮 |
| 中间色标列 | 上方：三组下拉按钮 + 色标名称 + 单位 + 只读的色标范围；下方左「细色标柱 + 温度刻度」、右「色标节点卡片列表」 |
| 右侧图片列表 | 缩略图 + 显示名，当前预览行浅蓝底；顶部「选择」开关与「导出图片」，底部「添加图片」与「删除选中」 |
| 底部运行日志 | 每步操作都带时间戳，「清空日志」可清屏 |

> 窗口较窄时（手机 / 平板竖屏）上表的「左侧 / 中间 / 右侧」会变成**自上而下的单栏**，整页可以上下滚动；
> 按钮与菜单会自动加大到适合手指点按的尺寸，下拉菜单不会超出屏幕。

按钮与菜单一览：

| 按钮 | 位置 | 里面有什么 |
| --- | --- | --- |
| 打开色标 | 中间列最上方 | **预设** / 我的色标 / 从设备中导入 / 输入色标 |
| 管理色标 | 中间列，夹在「打开色标」与「保存色标」之间 | 我的色标（管理弹窗）/ 从设备导入（收进色标库） |
| 保存色标 | 中间列最上方 | 保存 / 另存为 / 导出到剪贴板 |
| 导出图片 | 图片列表上方 | 单张导出（当前预览）/ 批量导出（已勾选的图片） |

## 2. 图片温度：黑色温度 / 白色温度

- 两个输入框在**预览区标题与「重置视图」之间**，默认 **黑色温度 50°C / 白色温度 -85°C**。
- **黑色温度** = 灰度值 0（纯黑）对应多少度；**白色温度** = 灰度值 255（纯白）对应多少度。
- **不要求谁大谁小**：白色温度高于黑色温度也完全合法，这时就是「浅色代表高温」。
  程序内部会**比较大小**得出上限（较大的那个）与下限（较小的那个），
  刻度、亮度换算、范围判断全都用这两个值，不需要你按顺序填。
- 两个温度填成一样也可以（整幅图就是同一个温度，全图一个颜色）。
- 修改后立即重新给预览上色，**不会改动任何色标节点**；运行日志里会写出这次换算出的上限 / 下限。
- 校验规则：两个都必须是数字、都必须落在 **-272.15°C ~ 1726.85°C**（内部 1 K ~ 2000 K）之间；
  非法时弹提示并**恢复原值**（除了数值范围，没有任何大小关系限制）。
- 单位切换（°C / °F / K / 亮度）时这两个框会自动换算显示，但温度本身不变。

## 3. 色标与节点

### 3.1 连续插值与色标范围

- 每个节点 = 一个温度 + 一个颜色；相邻节点之间**线性插值**，所以看到的是一条连续色带。
- 色标范围（只读显示，例如 `50°C ~ -85°C`）由**最高温节点**和**最低温节点**决定，不能直接编辑，只能通过改节点位置来改。
- 相邻节点颜色相同时，中间就是一段纯色平台（标准 BD 色阶大量使用这种做法）。

### 3.2 同一温度的两个节点 = 硬跳变

- **同一个位置最多允许 2 个节点**（位置精度 0.01 K）。两个节点同温时，色带上出现一条硬跳变。
- 这两个节点在节点列表里会并成一组共边框的卡片，分界线上骑着一个 **⇅ 双箭头按钮**，点一下交换两者顺序 —— 也就是改变硬跳变的方向（上面什么颜色、下面什么颜色）。
- 取色规则：**跳变上方取「靠上」那个节点的颜色，下方取「靠下」那个节点的颜色**；最冷端（图片温度低于色标最低温）的拉伸也取**最下方节点**的颜色。
- 横向 legend（弹窗里）与竖向 legend（第二列色标柱）以及图片着色使用同一套算法，三者结果永远一致。

### 3.3 保留节点

- 新建色标默认是「一个**保留节点** 50°C 黑色 + 一个普通节点 -85°C 白色」。
- 保留节点卡片上带「保留」标记：**只禁止删除**，位置与颜色都能改；它不参与批量勾选，「全选」不会勾中它，无论怎么删都至少留下它。
- 也就是说，色标里永远至少有一个节点。

### 3.4 新增 / 编辑 / 交换 / 删除

- **添加节点**：点节点列表上方的「添加节点」，默认落在当前最宽的温度空档中间，可以在对话框里改位置和颜色。
- **编辑节点**：点节点卡片打开对话框。位置只填数字（不带单位，按当前全局单位解释）；颜色支持 **Windows 原生取色器、HEX、R G B** 三向同步，HEX/RGB 非法时失焦会提示并回退。
- **删除节点**：打开节点列表顶部的「选择」开关，勾选后点「删除选中」；一个都没勾会提示「请选择节点」。
- 节点温度允许范围 **-272.15°C ~ 1726.85°C**（1 K ~ 2000 K），同一位置超过 2 个节点会被拒绝。

### 3.5 色标与图片温度不一致时（拉伸 / 截断）

所有 legend 的温度轴都等于**图片两端的温度**（黑色温度 ~ 白色温度），所以：

| 情况 | legend 表现 |
| --- | --- |
| 色标比图片温度区间**窄**（例如色标 -80~28，图片 -85~50） | 两端节点颜色被**拉伸**到图片两端的温度 |
| 色标比图片温度区间**宽**（例如色标 -200~200） | 只显示图片温度区间那一段，超出部分**截断**不显示 |

- 图片温度**高于色标最高温节点** → 一律取最高温节点的颜色；**低于最低温节点** → 取最低温节点的颜色。
- 竖向色标柱**顶端永远是黑色端、底端永远是白色端**，柱子上的刻度就是各灰度对应的温度；
  所以「浅色代表高温」时，顶端的数字比底端小。
- 这套规则同样作用于「我的色标 / 管理色标」弹窗里的横向 legend（横向那根是**温度轴**：左低右高），
  因此列表里所有色标可以直接横向对比。

## 4. 预设色标

**打开色标 → 预设** 会弹出配置文件里的预置色标列表：样式与「我的色标」一样（每条一条横向 legend + 名称），
底部是左 **取消** 右 **导入**。选中一条按「导入」，它就变成当前正在编辑的色标。

| 预设 | 节点数 | 色标范围 | 说明 |
| --- | --- | --- | --- |
| **空白** | 1 | 0°C 一个点 | 单个白色保留节点 → 整幅纯白，用来从零搭一套色标 |
| IR-BW | 2 | 50 ~ -85°C | 黑白连续色标（与程序启动时的默认色标相同） |
| IR-BD | 18 | 28 ~ -81°C | 标准 BD 色阶（早期版本） |
| IR-BD-ex | 24 | 28 ~ -93°C | 标准 BD 色阶扩展版，冷端多了三段深灰平台 |
| IR-CA | 26 | 50 ~ -100°C | 彩色增强（灰 → 蓝绿 → 黄 → 红 → 紫 → 白） |
| IR-CC | 19 | 28 ~ -85°C | 彩色增强（红 / 橙 / 黄 / 青 / 蓝） |
| IR-OTT | 16 | 28 ~ -90°C | OTT 配色 |
| IR-RAMMB | 14 | 35 ~ -100°C | RAMMB 配色，色标宽度覆盖整个默认图片范围 |
| IR-RBTOP | 20 | 50 ~ -100°C | RBTOP 配色 |

- **预设文件里没有 `created`**：`created`（毫秒时间戳）是色标的身份，**只在导入的那一刻生成**。
  所以每导入一次就是一条**全新的**色标，可以再点「保存色标 → 保存」把它存进本地色标库，
  之后它就和预设无关了（改它、删它都不会影响预设本身）。
- 预设**不会**自动进本地色标库：程序启动时不再往 localStorage 里塞任何东西，
  列表来自随工具发行的配置文件（见下面「预置数据的来源」）。
- 导入的色标出现在标题栏名字里（例如 `IR-BD-ex`），此时不带 `*`（视为已保存状态），
  但**没有**对应文件，按「保存」只会存进本地色标库。
- 当前色标有未保存修改时，选完预设按「导入」会先问一次「是否继续」，取消则什么都不变。
- 想再要一份「干净的空白色标」，导入 **空白** 即可（这就是原来「新色标」的用法）。

**预置数据的来源（配置文件驱动）**

预置列表**不在 `index.html` 里**，而是每次打开页面时从 `PreSet/` 目录读配置：

| 文件 | 作用 |
| --- | --- |
| `PreSet/manifest.js` | 清单：`window.IR_PRESET_FILES = ['空白.js', 'IR-BW.js', …]`，**顺序就是弹窗里的顺序** |
| `PreSet/<名字>.js` | 一条预置：一行 JS 包装 + 一段色标 JSON；文件名必须与里面的 `name` 一致 |

- **新增一套预置**：在 `PreSet/` 里复制一份现有的 `.js` 改数据，再在 `manifest.js` 的清单里加一行即可。
  **完全不用动 `index.html`**，也没有任何构建 / 生成步骤。
- **修改一套预置**：直接改对应的那个文件，重新打开页面就生效。
- **为什么配置文件是 `.js` 而不是 `.json`**：双击打开时页面源是 `file://`，
  浏览器禁止 `fetch` / `XMLHttpRequest` 读本地文件，只允许 `<script src>` 载入脚本，
  所以配置文件写成「一行 JS 包装 + 一段 JSON」，数据部分仍然可以直接从「另存为」的 JSON 里拷。
- **出问题时的表现**：清单缺失、某个文件载入失败、内容非法（温度越界 / 颜色写法不对 /
  同一位置超过 2 个节点），或文件名与 `name` 不一致（只提示不算错）——
  都会**跳过该条并在运行日志里写明原因**，预设列表为空，**不会退回任何硬编码数据**。
- `PreSet` 目录要与 `index.html` 放在一起；只拷走 `index.html` 也能正常使用，只是预设列表为空
  （此时可以用「管理色标 → 从设备导入」把色标 JSON 收进本地色标库）。

## 5. 色标库

### 5.1 色标身份 = 毫秒时间戳

- 每个色标都有一个毫秒级创建时间戳 `created`，它是色标的**唯一身份**，一经创建永不修改；名称只是标签，随时可改。
- 同一时间戳 = 同一条色标（保存时覆盖）；不同时间戳 = 两个色标（哪怕名字完全一样）。

### 5.2 保存 / 另存为 / 导出到剪贴板

- **保存**：写入浏览器本地色标库（localStorage 的 `ir_enhancer.scales.v1`），**不会**动设备上已打开的文件。
- **另存为**：导出一份 JSON 到设备（Windows 原生另存为；不支持的浏览器改为下载）。
- **导出到剪贴板**：把**当前正在编辑的这条色标**复制成 JSON 文本（内容与「另存为」完全一样），
  不用先存文件就能粘到聊天窗口 / 记事本，或者用「打开色标 → 输入色标」在别处贴回来。
  复制成功后这一项显示 **「已复制」**（蓝色高亮），**最多停留 2 秒**再渐隐复原；
  这 2 秒里菜单**不会自动收起**（否则看不到反馈），点别处关掉菜单就**立刻**切回原文案。
  万一浏览器不允许写剪贴板，会弹提示并建议改用「另存为」。
- 有未保存修改时窗口标题会带 `*`；新建 / 载入 / 导入前会先问「是否保存」，直接关页面也会提醒。

### 5.3 我的色标

- 打开色标 → 我的色标：列出本地库里的色标，每条显示**横向 legend + 名称 + 创建时间**（`创建于YYYYMMDD HH:mm:SS`）。
- 横向 legend 以**当前图片两端的温度**为温度轴（左低右高），方便横向比较不同色标。
- 点一条选中，按 **确定** 载入（未选中时「确定」是禁用的）；底部左「取消」右「确定」。
- 底部的 **「导出到剪贴板」** 在**单选一条之后**才可用（多选状态下不可用）：点一下就把这条色标的 JSON 复制走，
  内容与「另存为」导出的文件完全一样，可以直接粘到聊天窗口、记事本，或用下面的「输入色标」再贴回来。
- 复制成功后按钮显示 **「已复制」**（蓝色高亮）：**最多停留 2 秒**，随后逐渐隐去并切回「导出到剪贴板」。
  这 2 秒里如果**换了选中的色标**（或切了「多选」、删了记录、关掉弹窗），会**立刻**切回原文案，
  正在进行的渐隐动画也会直接中断；弹窗**每次打开都是「导出到剪贴板」**。

### 5.4 管理色标

- 管理色标 → 我的色标：同一个弹窗的增强版，右上角多了「多选」勾选框和红色「删除」按钮。
- 勾上「多选」后，每条左侧出现勾选框，并多出「全选 / 全不选」；勾选后即可**从本地库永久删除**，删除完成自动退出多选状态。
- 不勾「多选」时是单选：选一条后「导入」和「删除」同时可用（可单独导入或删除）。底部左「取消」右「导入」。
- 「导出到剪贴板」在这个弹窗里同样有，**只认单选**：一勾「多选」它就变灰。

### 5.5 两个「从设备…」的区别

| 入口 | 作用 |
| --- | --- |
| 打开色标 → 从设备中导入 | 读一份 JSON，**载入成当前正在编辑的色标**（不动本地库） |
| 管理色标 → 从设备导入 | 读一份或多份 JSON，**收进本地色标库**（按时间戳覆盖或新增），不改动当前色标 |

### 5.6 输入色标（直接粘贴文本）

**打开色标 → 输入色标**：弹出一个文本框，把一段色标 JSON 粘进去按「确定」就载入成当前色标，不用先存成文件。

- 文本框里粘贴的内容，就是「导出到剪贴板」/「另存为」拿到的那种 JSON（`created` / `name` / `nodes`）。
- **就地校验**：JSON 格式错、字段缺失、颜色写法不对、节点温度超出 1 K ~ 2000 K、同一位置超过 2 个节点……
  都会在文本框下方用红字说明**具体原因**，弹窗**不会关**，文本也不会丢，改完再按「确定」即可。
- 校验通过后才会替换当前色标；如果当前色标有未保存的修改，会先问一次「是否继续」（和新建 / 导入的规则一样）。
- 文本里没有 `created` 时会自动补上当前时间戳（它就成了一条新色标，可以用「保存色标 → 保存」存进本地库）。
- 载入后开头不带 `*`（视为已保存状态），但**没有**对应文件，所以「保存」只会存进本地色标库。
- 取消 / Esc 都不会改动当前色标。

## 6. 配置文件（JSON）格式

导出的色标就是这样一个 JSON，可以直接手改后再导入（**打开色标 → 输入色标** 可以直接粘贴这段文本，
不必先存成文件）：

```json
{
  "created": 1735660800000,
  "name": "IR-BD",
  "nodes": [
    { "temperature_k": 301.15, "color": "#000000", "pinned": true },
    { "temperature_k": 282.15, "color": "#F7F7F7" },
    { "temperature_k": 193.15, "color": "#555555" }
  ]
}
```

| 字段 | 必填 | 说明 |
| --- | --- | --- |
| `created` | 可选 | 毫秒时间戳，色标身份；缺失或非法时自动补当前时间 |
| `name` | 可选 | 色标名称；缺失或为空时用「未命名色标」 |
| `nodes` | **必填** | 节点数组，至少 1 个 |
| `nodes[].temperature_k` | **必填** | 节点温度，单位 **Kelvin**，允许 1.0 ~ 2000.0 |
| `nodes[].color` | **必填** | 颜色，`#RRGGBB`（也认 `#RGB`） |
| `nodes[].pinned` | 可选 | `true` 表示保留节点（不可删除） |

校验规则：顶层必须是对象；同一位置（0.01 K 精度）最多 2 个节点；**色标里没有温度字段**（旧文件里遗留的 `range` 字段会被直接忽略）。任何一条不满足都会给出具体原因，并且**当前色标保持不变**。

## 7. 图片管理

- 支持 **PNG**（单通道灰度 + Alpha / RGB / RGBA / 调色板 / 16 位灰度）与 **JPG / JPEG**，一次可选多张。
- 只能通过「添加图片」按钮打开 Windows 原生文件选择器，**不支持拖拽**导入。
- 允许重复导入同一张图，显示名自动加后缀：`image.png` → `image(1).png` → `image(2).png`（导出时按显示名写文件，不会互相覆盖）。
- 图片列表在窗口最右侧：缩略图保持比例不裁剪、文件名过长省略并带悬停提示、当前预览行浅蓝底。
- 单击切换预览；打开「选择」开关后，点击只切换勾选、不切换预览，点「删除选中」批量删除（没勾选会提示「请选择图片」）。
- 图片**按需从磁盘读取**，同一时刻只有当前图片驻留内存，几十上百张也不会把内存吃满。

## 8. 预览与视图操作

- 默认 Fit（整幅适应窗口），窗口大小变化时自动重新适应。
- **滚轮缩放**：以鼠标位置为中心，1.25 倍一档，范围 0.02× ~ 64×。
- **拖动平移**：按住左键拖动。
- **触屏手势**（手机 / 平板 / 触摸屏笔记本）：**单指拖动 = 平移**（Fit 状态下单指上下滑是**滚动页面**）；
  **双指捏合 = 缩放**（以两指中点为锚点）；**双击 = 在 Fit 与 2.5 倍之间切换**。
- **重置视图**：只把缩放和平移恢复成 Fit，**不改变**色标与图片数据。
- 预览上色与 legend 使用同一个 `ColorMapper`，所以「预览里看到的颜色」就是导出后的颜色。
- **窄屏（手机 / 平板竖屏）**：界面自动从「左预览 / 中色标 / 右图片列表」变成**自上而下的单栏**，整页可以上下滚动；
  预览固定约半屏高，色标节点列表与图片列表在各自的框内滚动，日志固定在整页底部。

## 9. 导出图片

- **格式跟随源文件**：PNG 进 PNG 出（无损、Alpha 原样保留）；JPG 进 JPG 出（质量 0.92，无 Alpha）。
- **单张导出**：导出当前预览的那张，保持原分辨率；用 Windows 原生「另存为」，不支持的浏览器改为下载。
- **批量导出**：只导出图片列表里**已勾选**的图片（一张都没勾时提示「请选择图片」）。
- 批量导出流程：先选目标文件夹 → 修改输出文件夹名（默认 `IR_Enhance_YYYYMMDD_HHMMSS`，同名自动追加 `(1)(2)…`，绝不覆盖已有文件）→ 进度条与 `正在处理 37 / 120：filename.png` → 可随时取消。
- 单个文件失败会跳过并在结束时汇总原因，**已成功导出的文件保留**（不回滚）；导出期间界面锁定，避免误操作。
- 浏览器不支持直接写文件夹时，批量导出会改为**打包成 ZIP 下载**（内部带同名的顶层文件夹）。

## 10. 单位与显示精度

- 单位下拉框只影响**显示与输入**，内部一律以 Kelvin 存储，导出不受影响。
- `°C` / `°F` / `K`：常规温标换算。
- `亮度`：就是灰度值本身 —— **黑色端 = 0、白色端 = 255**，刻度每 10°C 一个整数，适合和灰度原图直接对照。
  （黑色温度更高时，亮度 0 一边就是高温。）
- 温度与节点位置保存精度统一为 **0.01 K**，使用银行家舍入（round-half-even），所以 `200.125 → 200.12`、`200.135 → 200.14`。

## 11. 实现细节

- **PNG 由本程序自行解码 / 编码**（直接处理 PNG 数据块），灰度与 Alpha **逐字节精确**，不会因为 canvas 预乘 Alpha 往返而掉 1~2 级灰度。
- JPG 没有 Alpha 通道，按整幅不透明处理，走浏览器解码 / 编码。
- 颜色映射按 **0.01 K**（等于配置文件精度）对齐节点位置，所以「屏幕上的色标」与「保存后重新打开的色标」逐灰度完全一致。
- 横向 legend、竖向 legend 与图片着色共用同一个算法，任何情况下取色结果都一致。
- 需要 Edge / Chrome 等现代浏览器（用到 `DecompressionStream`、`dialog`、原生文件选择器）。缺少 `DecompressionStream` 时会退回浏览器解码，半透明像素可能有 ±1~2 灰度误差，日志会给出警告。
- 本地色标库使用 `localStorage`；浏览器禁用本地存储时会明确提示，保存 / 读取都不会静默失败。

## 12. 常见问题

- **导出后颜色和预览不一样？** 检查是否误改了「黑色温度 / 白色温度」，或导出的是另一张图片（批量导出只处理勾选的那些）。
- **想让浅色代表高温怎么办？** 把「白色温度」填得比「黑色温度」高就行（例如黑色 -85、白色 50）：
  两个框没有大小关系要求，上限 / 下限由程序自己比较得出，色标柱与刻度会跟着反过来（顶端数字变小、底端变大）。
- **为什么改色标温度没反应？** 色标一端超出图片温度区间时，图片只用到色标的一小部分（超出部分会被截断）；把色标那端调进图片温度区间内更有意义。
- **为什么删除按钮是灰的？** 「删除」在没勾选（或多选下没勾任何一条）时是禁用的；保留节点永远不能删。
- **同一温度放了两个节点，色带方向反了？** 点两个卡片之间的 **⇅** 按钮交换顺序即可。
- **从「预设」导入的色标，时间戳是哪来的？** 预设文件里没有 created，所以按**导入那一刻**生成；每导入一次都是新的一条，可以各自命名后分别保存。
- **换电脑 / 换浏览器后色标不见了？** 色标库存在浏览器的 localStorage 里，不会跟着文件走。用「另存为」导出 JSON，在新环境里「从设备中导入」即可。
- **怎么把一套色标发给别人？** 在「我的色标」里选中它，点 **「导出到剪贴板」**，把复制出来的 JSON 发给对方；对方用 **打开色标 →「输入色标」** 粘进去按确定就能用（或存成 `.json` 文件用「从设备中导入」）。
- **「导出到剪贴板」为什么是灰的？** 它只认**单选**：先在「我的色标 / 管理色标」里点中一条；勾了「多选」时也会变灰。
- **提示「无法写入剪贴板」怎么办？** 浏览器可能不允许脚本写剪贴板，或窗口没有焦点。改用「保存色标 → 另存为」导出成 JSON 文件即可。
- **粘贴的色标提示「配置内容非法」？** 照着红字说明改（通常是温度单位写成了摄氏度，或者颜色少写了 `#`）；`temperature_k` 必须是以 **Kelvin** 为单位的数字。
